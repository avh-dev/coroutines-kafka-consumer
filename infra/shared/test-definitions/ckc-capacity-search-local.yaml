name: ckc-capacity-search-local

deployment:
  app_profile: ckc-local-baseline
  stubs_profile: baseline

load_test:
  shards: 2
  base_rate: 120
  telemetry_rate_multiplier: 2.0
  load_profile: "0 -> (30s, warmup) -> 100 -> (2m, capacity-search) -> 100"
  cauldron_count: 1536
  orders_per_batch: 4
  max_batch_wait_seconds: 5
  brew_duration_seconds: 30
  tick_interval_millis: 100
  diagnostics_blob_size: 256
