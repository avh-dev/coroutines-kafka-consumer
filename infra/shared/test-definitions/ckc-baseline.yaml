name: ckc-baseline

deployment:
  app_profile: ckc-hpa
  stubs_profile: baseline
  kafka_topics:
    - name: potion.orders.lifecycle.v1
      partitions: 12
    - name: potion.cauldrons.telemetry.v1
      partitions: 12

load_test:
  shards: 4
  base_rate: 2000
  telemetry_rate_multiplier: 10.0
  load_profile: "0 -> (2m, warmup) -> 60 -> (8m, comparison) -> 100 -> (2m, cool-down) -> 0"
  cauldron_count: 8
  orders_per_batch: 3
  max_batch_wait_seconds: 30
  brew_duration_seconds: 120
  tick_interval_millis: 200
  diagnostics_blob_size: 512
