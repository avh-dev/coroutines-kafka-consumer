name: smoke-test

deployment:
  app_profile: ckc-single
  stubs_profile: fast
  kafka_topics:
    - name: potion.orders.lifecycle.v1
      partitions: 3
    - name: potion.cauldrons.telemetry.v1
      partitions: 3

load_test:
  shards: 1
  base_rate: 1
  telemetry_rate_multiplier: 5.0
  load_profile: "0 -> (10s, warmup) -> 100 -> (60s, smoke) -> 100 -> (10s, cool-down) -> 0"
  cauldron_count: 2
  orders_per_batch: 2
  max_batch_wait_seconds: 5
  brew_duration_seconds: 3
  tick_interval_millis: 500
  diagnostics_blob_size: 64
