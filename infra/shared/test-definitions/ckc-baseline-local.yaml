name: ckc-baseline-local

deployment:
  app_profile: ckc-hpa
  stubs_profile: baseline

load_test:
  shards: 2
  base_rate: 75
  telemetry_rate_multiplier: 2.0
  load_profile: "0 -> (1m, warmup) -> 100 -> (10m, local-baseline) -> 100 -> (1m, cool-down) -> 0"
  cauldron_count: 1536
  orders_per_batch: 4
  max_batch_wait_seconds: 5
  brew_duration_seconds: 30
  tick_interval_millis: 100
  diagnostics_blob_size: 256
