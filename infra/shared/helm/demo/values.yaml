replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  port: 8080

env:
  springProfilesActive: ckc
  kafkaEnabled: true
  demoKafkaEnabled: true
  bootstrapServers: ""
  redisHost: ""
  redisPort: 6379
  modelBaseUrl: ""
  auditLogEnabled: true
  lifecycleWorkerConcurrency: 2
  lifecyclePollLoopConcurrency: 1
  lifecycleWorkChannelCapacity: 1024
  telemetryWorkerConcurrency: 4
  telemetryPollLoopConcurrency: 1
  telemetryWorkChannelCapacity: 256

resources: {}

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
  startup:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
