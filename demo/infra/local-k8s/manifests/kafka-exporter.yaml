apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckc-kafka-exporter
  namespace: ckc-observability
  labels:
    app.kubernetes.io/name: ckc-kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-kafka-exporter
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args:
            - --kafka.server=ckc-kafka.ckc-app.svc.cluster.local:9092
            - --web.listen-address=:9308
            - --topic.filter=^potion\..*
            - --group.filter=^potion-tracking-.*
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-kafka-exporter
  namespace: ckc-observability
  labels:
    app.kubernetes.io/name: ckc-kafka-exporter
spec:
  selector:
    app.kubernetes.io/name: ckc-kafka-exporter
  ports:
    - name: metrics
      port: 9308
      targetPort: metrics
