apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckc-prometheus
  namespace: ckc-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ckc-prometheus-discovery
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ckc-prometheus-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckc-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: ckc-prometheus
    namespace: ckc-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ckc-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-prometheus
    spec:
      serviceAccountName: ckc-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: ckc-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-prometheus
  namespace: ckc-observability
spec:
  selector:
    app.kubernetes.io/name: ckc-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckc-grafana
  namespace: ckc-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: ckc-grafana-datasource
        - name: dashboard-provider
          configMap:
            name: ckc-grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: ckc-grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-grafana
  namespace: ckc-observability
spec:
  selector:
    app.kubernetes.io/name: ckc-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
