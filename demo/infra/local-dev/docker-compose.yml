services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.3
    container_name: ckc-local-redpanda
    cpus: "0.50"
    mem_limit: 768m
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://localhost:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: ckc-local-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    container_name: ckc-local-fluent-bit
    profiles:
      - audit
    ports:
      - "127.0.0.1:5170:5170"
      - "127.0.0.1:2020:2020"
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
    depends_on:
      audit-archiver:
        condition: service_healthy

  audit-archiver:
    image: python:3.13-alpine
    container_name: ckc-local-audit-archiver
    profiles:
      - audit
    command: ["python", "/app/archive-audit.py", "--output-dir", "/audit/chunks"]
    volumes:
      - ../internal-lab/assets/helpers/archive-audit.py:/app/archive-audit.py:ro
      - ../../../.demo-infra/local-dev/audit/live:/audit
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 5171), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: ckc-local-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ckc-local-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../shared/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../shared/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
