schema_version: 2
name: ckc-spring-boot-smoke
description: Run the internal-lab smoke test against the CKC Spring Boot starter demo
  profile.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    flavour:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    base_tps: 10
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    load_profile: 0 -> (10s, warmup) -> 100 -> (60s, smoke) -> 100 -> (10s, cool-down)
      -> 0
    cauldron_count: 2
    min_orders_per_batch: 2
    max_orders_per_batch: 3
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
targets:
- name: ckc-spring-boot
  implementation: ckc-spring-boot
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
environments:
  internal-lab:
    lab:
      profile: installed
