schema_version: 2
name: msk-elasticache-20min-10k
description: Twenty-minute 10k/s CKC run on fixed EKS, MSK, and ElastiCache capacity.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    flavour:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    base_tps: 10000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    load_profile: 0 -> (600s, warmup) -> 100 -> (540s, steady) -> 100 -> (60s, cool-down)
      -> 0
    cauldron_count: 32
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    workers: 100
    stats_log_interval_seconds: 15
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: true
    telemetry_settle_seconds: 65
    maximum_first_sample_delay_seconds: 90
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
targets:
- name: ckc
  implementation: ckc
  application:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: '2'
        memory: 2Gi
    hpa:
      enabled: true
      min_replicas: 2
      max_replicas: 6
      target_cpu_utilization_percentage: 70
      scale_down_stabilization_window_seconds: 600
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    parallelism:
    - partitions
    - workers
    topics:
      order:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: FRESHNESS_FIRST_DROP_OLDEST
environments:
  aws:
    region: eu-central-1
    lab:
      kubernetes_version: '1.33'
      network:
        vpc_cidr: 10.42.0.0/16
        availability_zones:
        - eu-central-1a
        - eu-central-1b
        - eu-central-1c
        private_subnets:
        - 10.42.0.0/20
        - 10.42.16.0/20
        - 10.42.32.0/20
        public_subnets:
        - 10.42.128.0/20
        - 10.42.144.0/20
        - 10.42.160.0/20
      nodes:
        instance_types:
        - m7i.xlarge
        desired_size: 3
        min_size: 3
        max_size: 3
        disk_size_gib: 100
      kafka:
        mode: msk
        msk_version: 3.7.x
        msk_brokers: 3
        msk_instance_type: kafka.m5.large
        msk_volume_size_gib: 50
      redis:
        mode: elasticache
        elasticache_node_type: cache.r7g.large
        elasticache_engine_version: '7.1'
        elasticache_nodes: 2
      observability:
        runner_peering: true
        runner_project: ckc-runner
        remote_write_port: 8428
        loki_port: 3100
        audit_port: 5170
