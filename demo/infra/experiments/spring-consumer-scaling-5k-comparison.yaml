schema_version: 2
name: spring-consumer-scaling-5k-comparison
description: Compare Spring Kafka latency at a fixed 5k/s on the isolated application worker while increasing per-topic partitions and consumers from the latency-sized baseline to two and four times that parallelism.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      percentiles:
        p90: 10
        p95: 20
        p99: 40
        p100: 60
    flavour:
      percentiles:
        p90: 10
        p95: 20
        p99: 40
        p100: 60
    registry:
      percentiles:
        p90: 2
        p95: 3
        p99: 4
        p100: 5
  load:
    shards: 1
    workers: 100
    base_tps: 5000
    producer_capacity_tps:
      order: 5000
      batch: 5000
      telemetry: 5000
    load_profile: 0 -> (3m, warmup) -> 100 -> (7m, steady) -> 100
    cauldron_count: 32
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 32768
    batch_kafka_producer_batch_size: 32768
    telemetry_kafka_producer_batch_size: 32768
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: true
    telemetry_settle_seconds: 65
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - name: steady-state
    start: 3m
    duration: 7m
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 30
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_partition
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 30
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_partition
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
      contract:
        semantics: freshness_first
        delivery: not_guaranteed
        ordering: not_guaranteed
targets:
- name: spring-kafka.consumers-1x
  annotation_label: Spring Kafka · 90 consumers (1×) · split host
  implementation: spring-kafka
  application: &spring_application
    placement: worker
    replicas: 1
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        memory: 3Gi
    hpa:
      enabled: false
    java_options: -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
  runtime: &spring_runtime_1x
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: JDK
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 600
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 500
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 250
    planning_latency:
      order_ms: 8
      batch_ms: 7
      telemetry_ms: 21
    planning_headroom_percent: 30
    parallelism:
    - partitions
    - pollers
    topics:
      order:
        partitions: 18
        pollers: 18
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        partitions: 15
        pollers: 15
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        partitions: 57
        pollers: 57
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka.consumers-2x
  annotation_label: Spring Kafka · 180 consumers (2×) · split host
  implementation: spring-kafka
  application: *spring_application
  runtime:
    <<: *spring_runtime_1x
    topics:
      order:
        partitions: 36
        pollers: 36
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        partitions: 30
        pollers: 30
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        partitions: 114
        pollers: 114
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka.consumers-4x
  annotation_label: Spring Kafka · 360 consumers (4×) · split host
  implementation: spring-kafka
  application: *spring_application
  runtime:
    <<: *spring_runtime_1x
    topics:
      order:
        partitions: 72
        pollers: 72
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        partitions: 60
        pollers: 60
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        partitions: 228
        pollers: 228
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources:
          cpu_per_broker: 1
          memory_per_broker: 2Gi
          heap_per_broker: 1Gi
