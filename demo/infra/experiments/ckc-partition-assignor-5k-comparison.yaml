schema_version: 2
name: ckc-partition-assignor-5k-comparison
description: Compare Kafka range and round-robin partition assignment for CKC across ten fixed replicas on the internal-lab application worker.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub
      percentiles:
        p90: 10
        p95: 20
        p99: 40
        p100: 60
    flavour: *fast_stub
    registry:
      percentiles:
        p90: 2
        p95: 3
        p99: 4
        p100: 5
  load:
    shards: 1
    workers: 100
    base_tps: 5000
    producer_capacity_tps:
      order: 5000
      batch: 5000
      telemetry: 5000
    load_profile: 0 -> (3m, ramp) -> 100 -> (7m, full-load) -> 100
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 524288
    batch_kafka_producer_batch_size: 524288
    telemetry_kafka_producer_batch_size: 131072
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: false
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: true
    telemetry_settle_seconds: 90
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - name: full-load
    start: 3m
    duration: 7m
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 20
      max_e2e_latency_ms: 2000
      contract:
        semantics: freshness_first
        delivery: not_guaranteed
        ordering: not_guaranteed
targets:
- &range_target
  name: ckc.range.fixed-10
  annotation_label: CKC · range assignor · 10 pods · optilab2
  implementation: ckc
  application: &application
    placement: worker
    replicas: 10
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 768Mi
    hpa:
      enabled: false
    java_options: >-
      -Xms128m -Xmx384m -Xss256k -XX:+UseSerialGC
      -Dcom.linecorp.armeria.defaultResponseTimeoutMillis=75000
  runtime: &runtime
    env: &range_env
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: false
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: true
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_ASSIGNMENT_STRATEGY: org.apache.kafka.clients.consumer.RangeAssignor
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
    planning_latency:
      order_ms: 8
      batch_ms: 7
      telemetry_ms: 21
    parallelism:
    - workers
    topics:
      order:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        partitions: 12
        workers: 100
        queue_capacity: 4096
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- <<: *range_target
  name: ckc.round-robin.fixed-10
  annotation_label: CKC · round-robin assignor · 10 pods · optilab2
  application: *application
  runtime:
    <<: *runtime
    env:
      <<: *range_env
      KAFKA_CONSUMER_ASSIGNMENT_STRATEGY: org.apache.kafka.clients.consumer.RoundRobinAssignor
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources:
          cpu_per_broker: 1
          memory_per_broker: 2Gi
          heap_per_broker: 1Gi
