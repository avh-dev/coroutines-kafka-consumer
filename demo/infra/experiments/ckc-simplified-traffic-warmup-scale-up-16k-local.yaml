schema_version: 2
name: ckc-simplified-traffic-warmup-scale-up-16k-local
description: >-
  Compare ordinary CKC cold scale-up with the simplified library-owned real-traffic
  warm-up while identical 800m pods scale one at a time during a forty-minute ramp
  from zero to 16k messages per second. The optional worker-local broker is present
  for both targets so its fixed resource cost does not bias the comparison.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub {percentiles: {p90: 10, p95: 20, p99: 40, p100: 60}}
    flavour: *fast_stub
    registry: {percentiles: {p90: 2, p95: 3, p99: 4, p100: 5}}
    deployment:
      replicas: 2
      workers: 4
      resources:
        requests: {cpu: 300m, memory: 384Mi}
        limits: {memory: 1Gi}
  load:
    shards: 1
    workers: 100
    dispatcher_threads: 2
    base_tps: 16000
    producer_capacity_tps: {order: 16000, batch: 16000, telemetry: 16000}
    load_profile: >-
      0 -> (40m, linear-ramp-up) -> 100 -> (5m, steady) -> 100 ->
      (2m, cool-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: true
    cpu_request: 1500m
    memory_request: 768Mi
    memory_limit: 1280Mi
    java_options: -Xms256m -Xmx768m -XX:+UseSerialGC
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: false
    telemetry_settle_seconds: 300
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - {name: ramp-0-10m, start: 0m, duration: 10m}
  - {name: ramp-10-20m, start: 10m, duration: 10m}
  - {name: ramp-20-30m, start: 20m, duration: 10m}
  - {name: ramp-30-40m, start: 30m, duration: 10m}
  - {name: steady-16k, start: 40m, duration: 5m}
  diagnostics:
  - &warmup_capture
    at: 5m
    type: tcpdump
    name: warmup-ramp-5m
    targets: [application]
    duration: 5m
    params: {interface: auto, snaplen: 0, filter: tcp port 9092, max_file_size: 128Mi, role: producer}
    required: true
  - <<: *warmup_capture
    at: 15m
    name: warmup-ramp-15m
  - <<: *warmup_capture
    at: 25m
    name: warmup-ramp-25m
  - <<: *warmup_capture
    at: 35m
    name: warmup-ramp-35m
  topics:
    order: {kafka_topic: order.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    batch: {kafka_topic: batch.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    telemetry: {kafka_topic: cauldron.events.v1, traffic_percent: 20, max_e2e_latency_ms: 2000}
targets:
- name: ckc.cold-scale-up-serial-tuned-16k
  annotation_label: CKC · ordinary cold scale-up · tuned Serial · local 16k
  implementation: ckc
  placement: &worker_placement
    application: worker
    stubs: worker
    generator: controller
  application: &scale_application
    placement: worker
    replicas: 1
    resources:
      requests: {cpu: 800m, memory: 512Mi}
      limits: {memory: 1280Mi}
    java_options: >-
      -Xms768m -Xmx768m -Xss256k -XX:+UseSerialGC
      -XX:TargetSurvivorRatio=90 -XX:MaxTenuringThreshold=15
      -Xlog:gc,gc+heap=debug,gc+age=trace,safepoint=info:stdout:time,uptime,level,tags
    hpa: &scale_hpa
      enabled: true
      min_replicas: 1
      max_replicas: 12
      hot_pod_cpu:
        enabled: true
        source: thread_stats_excluding_jit
        strategy: replica_demand
        replace_cpu_trigger: true
        target_utilization_percentage: 85
        averaging_window: 30s
        observation_window: 1m
        query_step: 15s
        aggregation: average
        polling_interval_seconds: 15
        scale_up: {max_pods: 1, period_seconds: 180, tolerance: 0.1}
        scale_down: {max_pods: 1, period_seconds: 60, stabilization_window_seconds: 600}
  runtime: &cold_runtime
    env: &common_env
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: true
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      TRAFFIC_WARMUP_ENABLED: false
      TRAFFIC_WARMUP_CONTROL_TOPIC: ckc.traffic-warmup.v1.control
      TRAFFIC_WARMUP_QUOTA_PER_INTERVAL: 10
      TRAFFIC_WARMUP_QUOTA_INTERVAL_MS: 1000
      TRAFFIC_WARMUP_DURATION_SECONDS: 120
      TRAFFIC_WARMUP_TIMEOUT_SECONDS: 30
      TRAFFIC_WARMUP_PRODUCER_LINGER_MS: 15
    planning_latency: {order_ms: 8, batch_ms: 7, telemetry_ms: 21}
    parallelism: [workers]
    topics: &runtime_topics
      order: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      batch: {partitions: 60, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING}
      telemetry: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY}
- name: ckc.simplified-traffic-warmup-serial-tuned-16k
  annotation_label: CKC · simplified real-traffic warm-up · tuned Serial · local 16k
  implementation: ckc
  placement: *worker_placement
  application: *scale_application
  runtime:
    <<: *cold_runtime
    env:
      <<: *common_env
      TRAFFIC_WARMUP_ENABLED: true
    topics: *runtime_topics
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: single
        transport: tls
        brokers: 1
        replication_factor: 1
        min_insync_replicas: 1
        resources: {cpu_per_broker: 1, memory_per_broker: 2Gi, heap_per_broker: 1Gi}
    warmup_kafka:
      enabled: true
      image: apache/kafka:4.3.1
      placement: application
      heap: 512Mi
      resources:
        requests: {cpu: 500m, memory: 768Mi}
        limits: {cpu: '1', memory: 1Gi}
      topics:
      - {name: ckc.traffic-warmup.v1.control, partitions: 1}
      - {name: ckc.traffic-warmup.v1.order.events, partitions: 1}
      - {name: ckc.traffic-warmup.v1.batch.events, partitions: 1}
      - {name: ckc.traffic-warmup.v1.cauldron.events, partitions: 1}
