schema_version: 2
name: queue-backlog-crash-comparison
description: Compare queue-backlog crash behavior with large worker queues, low order/batch
  worker concurrency, and downstream slowdown.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 25
      delay_p95_ms: 40
      delay_p99_ms: 160
      delay_p100_ms: 300
    flavour:
      delay_p90_ms: 4
      delay_p95_ms: 6
      delay_p99_ms: 8
      delay_p100_ms: 50
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    workers: 8
    base_tps: 2000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (2m, warmup) -> 100 -> (4m, backlog-crash) -> 100 -> (1m, cool-down)
      -> 0
    cauldron_count: 75
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    max_burst: 2000
    diagnostics_blob_size: 256
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 50
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 45
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 5
      max_e2e_latency_ms: 1000
  chaos:
  - at: 2m
    duration: 2m
    type: stubs_degradation
    target: demo-stubs
    params:
      error_rate_percent: 0
      eta:
        delay_p90_ms: 1800
        delay_p95_ms: 2200
        delay_p99_ms: 3000
        delay_p100_ms: 4000
      flavour:
        delay_p90_ms: 1800
        delay_p95_ms: 2200
        delay_p99_ms: 3000
        delay_p100_ms: 4000
      registry:
        delay_p90_ms: 500
        delay_p95_ms: 800
        delay_p99_ms: 1200
        delay_p100_ms: 1800
  - at: 3m
    type: pod_crash
    target: ckc-demo
targets:
- name: ckc.fixed.2
  implementation: ckc
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 41.62
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_DROP_OLDEST
- name: cpc-reactor.fixed.2
  implementation: confluent-reactor
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 41.62
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka
  implementation: spring-kafka
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
    planning_latency:
      order_ms: 41.62
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka-coroutines-naive.fixed.2
  implementation: spring-kafka-coroutines-naive
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 41.62
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
environments:
  internal-lab:
    lab:
      profile: installed
