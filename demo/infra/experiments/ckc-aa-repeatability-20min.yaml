schema_version: 2
name: ckc-aa-repeatability-20min
description: Run the same CKC target twice at 2k/s for 20 minutes on the three-broker internal lab to measure run-to-run variability.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    flavour:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    base_tps: 2000
    producer_capacity_tps:
      order: 2000
      batch: 2000
      telemetry: 2000
    load_profile: 0 -> (60s, warmup) -> 100 -> (1080s, steady) -> 100 -> (60s, cool-down) -> 0
    cauldron_count: 32
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    workers: 100
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    telemetry_kafka_producer_linger_ms: 300
    telemetry_kafka_producer_batch_size: 131072
    order_kafka_producer_batch_size: 524288
    batch_kafka_producer_batch_size: 524288
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 5
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: true
    telemetry_settle_seconds: 65
    maximum_first_sample_delay_seconds: 90
  measurement_window:
    name: steady-state
    start: 4m
    duration: 15m
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
      contract:
        semantics: freshness_first
        delivery: not_guaranteed
        ordering: not_guaranteed
  diagnostics:
  - at: 10m
    type: tcpdump
    name: kafka-steady
    targets:
    - application
    - load-test
    duration: 15s
    params:
      interface: auto
      snaplen: 0
      filter: tcp port 9092
      max_file_size: 128Mi
targets:
- name: ckc.fixed.1.min-partitions.single-poller.run-1
  implementation: ckc
  application:
    replicas: 1
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 3Gi
    hpa:
      enabled: false
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: ARMERIA
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    parallelism:
    - partitions
    - workers
    - pollers
    topics:
      order:
        partitions: 3
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        partitions: 3
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        partitions: 3
        workers: 500
        pollers: 1
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
  workload:
    load:
      kafka_producer_linger_ms: 300
      telemetry_kafka_producer_linger_ms: 300
      order_kafka_producer_batch_size: 524288
      batch_kafka_producer_batch_size: 524288
      telemetry_kafka_producer_batch_size: 131072
- name: ckc.fixed.1.min-partitions.single-poller.run-2
  implementation: ckc
  application:
    replicas: 1
    resources:
      requests:
        cpu: '1'
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 3Gi
    hpa:
      enabled: false
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: ARMERIA
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    parallelism:
    - partitions
    - workers
    - pollers
    topics:
      order:
        partitions: 3
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        partitions: 3
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        partitions: 3
        workers: 500
        pollers: 1
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
  workload:
    load:
      kafka_producer_linger_ms: 300
      telemetry_kafka_producer_linger_ms: 300
      order_kafka_producer_batch_size: 524288
      batch_kafka_producer_batch_size: 524288
      telemetry_kafka_producer_batch_size: 131072
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources:
          cpu_per_broker: 1
          memory_per_broker: 2Gi
          heap_per_broker: 1Gi
