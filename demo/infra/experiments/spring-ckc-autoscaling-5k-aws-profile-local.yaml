schema_version: 2
name: spring-ckc-autoscaling-5k-aws-profile-local
description: >-
  Local 5k/s comparison using the AWS qualification normal ramp and steady
  window: per-topic Spring Kafka KEDA scaling versus CKC CPU HPA scaling.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub {percentiles: {p90: 10, p95: 20, p99: 40, p100: 60}}
    flavour: *fast_stub
    registry: {percentiles: {p90: 2, p95: 3, p99: 4, p100: 5}}
    deployment:
      replicas: 4
      workers: 4
      resources:
        requests: {cpu: 300m, memory: 384Mi}
        limits: {memory: 1Gi}
  load:
    shards: 1
    workers: 100
    dispatcher_threads: 2
    base_tps: 5000
    producer_capacity_tps: {order: 5000, batch: 5000, telemetry: 5000}
    # The 50k AWS qualification curve, normalized to a 5k/s local peak.
    load_profile: 0 -> (5m, normal-ramp-1) -> 1 -> (5m, normal-ramp-2) -> 6 -> (5m, normal-ramp-3) -> 28 -> (5m, normal-ramp-4) -> 73 -> (5m, normal-ramp-5) -> 100 -> (10m, steady) -> 100 -> (5m, normal-cool-down-1) -> 73 -> (5m, normal-cool-down-2) -> 28 -> (5m, normal-cool-down-3) -> 6 -> (5m, normal-cool-down-4) -> 1 -> (5m, normal-cool-down-5) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 32768
    batch_kafka_producer_batch_size: 32768
    telemetry_kafka_producer_batch_size: 32768
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: true
    cpu_request: 800m
    memory_request: 768Mi
    cpu_limit: null
    memory_limit: 1280Mi
    java_options: -Xms256m -Xmx768m -XX:+UseSerialGC
    consumer_drain_timeout_seconds: 60
    consumer_drain_required: false
    telemetry_settle_seconds: 180
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - name: steady-state
    start: 25m
    duration: 10m
  topics:
    order: {kafka_topic: order.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    batch: {kafka_topic: batch.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    telemetry: {kafka_topic: cauldron.events.v1, traffic_percent: 20, max_e2e_latency_ms: 2000}
targets:
- name: spring-kafka.per-topic-keda-1-5
  annotation_label: Spring Kafka · native per-topic Kafka lag autoscaling · local
  implementation: spring-kafka
  application:
    deployment_mode: per_topic
    placement: worker
    resources:
      requests: {cpu: 300m, memory: 512Mi}
      limits: {memory: 1280Mi}
    java_options: -Xms256m -Xmx768m -Xss256k -XX:+UseSerialGC
    workloads:
      order:
        replicas: 1
        group_id: ckc-demo-order
        hpa: &topic_hpa
          enabled: true
          min_replicas: 1
          max_replicas: 5
          target_cpu_utilization_percentage: 200
          scale_up: {stabilization_window_seconds: 30, max_pods: 2, period_seconds: 60}
          scale_down: {stabilization_window_seconds: 600, max_pods: 1, period_seconds: 300}
          kafka_lag: {enabled: true, lag_threshold: 1500}
      batch:
        replicas: 1
        group_id: ckc-demo-batch
        hpa: {<<: *topic_hpa, kafka_lag: {enabled: true, lag_threshold: 1500}}
      telemetry:
        replicas: 1
        group_id: ckc-demo-telemetry
        hpa: {<<: *topic_hpa, max_replicas: 3, kafka_lag: {enabled: true, lag_threshold: 1250}}
  runtime:
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: JDK
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 600
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 500
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 250
    planning_latency: {order_ms: 8, batch_ms: 7, telemetry_ms: 21}
    planning_headroom_percent: 30
    parallelism: [partitions, pollers]
    topics:
      order: {partitions: 27, pollers: 5, processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING}
      batch: {partitions: 21, pollers: 4, processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING}
      telemetry: {partitions: 30, pollers: 10, processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED}
- name: ckc.hpa-1-20
  annotation_label: CKC · fixed one worker · CPU HPA · local
  implementation: ckc
  application:
    placement: worker
    replicas: 1
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1280Mi}
    java_options: -Xms256m -Xmx768m -Xss256k -XX:+UseSerialGC
    hpa:
      enabled: true
      min_replicas: 1
      max_replicas: 20
      target_cpu_utilization_percentage: 75
      scale_down_stabilization_window_seconds: 300
  runtime:
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
    planning_latency: {order_ms: 8, batch_ms: 7, telemetry_ms: 21}
    parallelism: [workers]
    topics:
      order: {partitions: 20, workers: 100, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      batch: {partitions: 20, workers: 100, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      telemetry: {partitions: 20, workers: 100, queue_capacity: 4096, processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY}
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources: {cpu_per_broker: 1, memory_per_broker: 2Gi, heap_per_broker: 1Gi}
