schema_version: 2
name: internal-tls-network-counters-smoke
description: One-target Kafka TLS smoke with nftables client network accounting and no packet capture.
workload:
  stubs:
    error_rate_percent: 0
    eta: {percentiles: {p90: 20, p95: 40, p99: 80, p100: 120}}
    flavour: {percentiles: {p90: 20, p95: 40, p99: 80, p100: 120}}
    registry: {percentiles: {p90: 2, p95: 3, p99: 4, p100: 5}}
  load:
    shards: 1
    workers: 4
    base_tps: 500
    producer_capacity_tps: {order: 1000, batch: 1000, telemetry: 1000}
    load_profile: 0 -> (1m, ramp) -> 100 -> (18m, steady) -> 100 -> (1m, cool-down) -> 0
    cauldron_count: 8
    min_orders_per_batch: 2
    max_orders_per_batch: 3
    min_brewing_steps: 5
    max_brewing_steps: 8
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 5
    consumer_drain_required: false
    telemetry_settle_seconds: 15
  measurement_windows: [{name: steady, start: 1m, duration: 18m}]
  topics:
    order: {kafka_topic: order.events.v1, traffic_percent: 35, max_e2e_latency_ms: 2000}
    batch: {kafka_topic: batch.events.v1, traffic_percent: 25, max_e2e_latency_ms: 2000}
    telemetry: {kafka_topic: cauldron.events.v1, traffic_percent: 40, max_e2e_latency_ms: 1000}
targets:
- name: ckc-tls-network-counters
  implementation: ckc
  observability: {kafka_network_counters: {enabled: true}}
  application: {replicas: 1, hpa: {enabled: false}}
  runtime:
    env: {DEMO_CONSUMER_PROCESSING_ENABLED: true, AUDIT_LOG_ENABLED: true, METRICS_IMPLEMENTATION: MICROMETER, PROCESSING_DISPATCHER_TYPE: FIXED, WORKER_DISPATCHER_THREADS: 1}
    planning_latency: {order_ms: 50, batch_ms: 50, telemetry_ms: 150}
    topics:
      order: {partitions: 4, workers: 4, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      batch: {partitions: 4, workers: 4, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      telemetry: {partitions: 4, workers: 4, processing_mode: FRESHNESS_FIRST_DROP_OLDEST}
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        transport: tls
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources: {cpu_per_broker: 1, memory_per_broker: 2Gi, heap_per_broker: 1Gi}
