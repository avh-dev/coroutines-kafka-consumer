schema_version: 2
name: consumer-capacity-comparison
description: Compare suspend CKC, CKC sync dispatcher modes, Confluent Parallel Consumer
  Reactor, and Spring Kafka on the same baseline test.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 25
      delay_p95_ms: 40
      delay_p99_ms: 160
      delay_p100_ms: 300
    flavour:
      delay_p90_ms: 10
      delay_p95_ms: 12
      delay_p99_ms: 15
      delay_p100_ms: 50
    registry:
      delay_p90_ms: 10
      delay_p95_ms: 14
      delay_p99_ms: 18
      delay_p100_ms: 60
  load:
    shards: 1
    workers: 8
    base_tps: 25000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (6m, capacity) -> 100
    cauldron_count: 75
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    diagnostics_blob_size: 256
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 60
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 0
      max_e2e_latency_ms: 1000
targets:
- name: ckc.fixed.2
  implementation: ckc
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- name: ckc.fixed.1
  implementation: ckc
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- name: cpc-reactor.fixed.1
  implementation: confluent-reactor
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: ckc-sync.io
  implementation: ckc-sync
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: IO
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- name: ckc-sync.virtual-thread
  implementation: ckc-sync
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: VIRTUAL
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- name: spring-kafka-thread-pool
  implementation: spring-kafka-thread-pool
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka
  implementation: spring-kafka
  application:
    replicas: 2
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 3Gi
    java_options: -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
    planning_latency:
      order_ms: 25
      batch_ms: 25
      telemetry_ms: 70
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
environments:
  internal-lab:
    lab:
      profile: installed
