schema_version: 2
name: aws-spring-keda-50k-ramp
description: Spring Kafka per-topic KEDA and EKS node-autoscaling qualification from one pod per topic to 50k TPS.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub
      percentiles:
        p90: 10
        p95: 20
        p99: 40
        p100: 60
    flavour: *fast_stub
    registry:
      percentiles:
        p90: 2
        p95: 3
        p99: 4
        p100: 5
    deployment:
      replicas: 4
      workers: 4
      resources:
        requests:
          cpu: 300m
          memory: 384Mi
        limits:
          memory: 1Gi
  load:
    shards: 2
    workers: 100
    dispatcher_threads: 2
    base_tps: 50000
    producer_capacity_tps:
      order: 10000
      batch: 10000
      telemetry: 10000
    load_profile: 0 -> (20m, ramp) -> 100 -> (20m, steady) -> 100 -> (10m, cool-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 32768
    batch_kafka_producer_batch_size: 32768
    telemetry_kafka_producer_batch_size: 32768
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: true
    cpu_request: 800m
    memory_request: 768Mi
    cpu_limit: null
    memory_limit: 1280Mi
    java_options: -Xms256m -Xmx768m -XX:+UseG1GC
    consumer_drain_timeout_seconds: 60
    consumer_drain_required: false
    telemetry_settle_seconds: 180
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - name: ramp
    start: 0s
    duration: 20m
  - name: steady
    start: 20m
    duration: 20m
  - name: cool-down
    start: 40m
    duration: 10m
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_partition
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_partition
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 20
      max_e2e_latency_ms: 2000
      contract:
        semantics: freshness_first
        delivery: not_guaranteed
        ordering: not_guaranteed
targets:
- name: spring-kafka.per-topic-keda-1-5
  annotation_label: Spring Kafka · native per-topic Kafka lag autoscaling · AWS
  implementation: spring-kafka
  application:
    deployment_mode: per_topic
    resources:
      requests:
        cpu: 850m
        memory: 1Gi
      limits:
        memory: 1280Mi
    java_options: -Xms256m -Xmx768m -Xss256k -XX:+UseG1GC
    workloads:
      order:
        replicas: 1
        group_id: ckc-demo-order
        hpa: &topic_hpa
          enabled: true
          min_replicas: 1
          max_replicas: 5
          target_cpu_utilization_percentage: 200
          scale_up:
            stabilization_window_seconds: 30
            max_pods: 2
            period_seconds: 60
          scale_down:
            stabilization_window_seconds: 600
            max_pods: 1
            period_seconds: 300
          kafka_lag:
            enabled: true
            lag_threshold: 1500
      batch:
        replicas: 1
        group_id: ckc-demo-batch
        hpa:
          <<: *topic_hpa
          kafka_lag:
            enabled: true
            lag_threshold: 1500
      telemetry:
        replicas: 1
        group_id: ckc-demo-telemetry
        hpa:
          <<: *topic_hpa
          kafka_lag:
            enabled: true
            lag_threshold: 1250
  runtime:
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: JDK
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 600
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 500
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 250
    planning_latency:
      order_ms: 8
      batch_ms: 7
      telemetry_ms: 21
    planning_headroom_percent: 30
    parallelism:
    - partitions
    - pollers
    topics:
      order:
        # 210 is divisible by both five maximum replicas and three brokers.
        partitions: 210
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        # The calculated requirement is 182; 195 is the next multiple of fifteen.
        partitions: 195
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        # The calculated requirement is 273; 285 is the next multiple of fifteen.
        partitions: 285
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
environments:
  aws:
    region: eu-central-1
    lab:
      kubernetes_version: '1.33'
      network:
        vpc_cidr: 10.42.0.0/16
        availability_zones:
        - eu-central-1a
        - eu-central-1b
        - eu-central-1c
        private_subnets:
        - 10.42.0.0/20
        - 10.42.16.0/20
        - 10.42.32.0/20
        public_subnets:
        - 10.42.128.0/20
        - 10.42.144.0/20
        - 10.42.160.0/20
      node_groups:
        support:
          instance_types:
          - m7i.xlarge
          desired_size: 2
          min_size: 2
          max_size: 2
          disk_size_gib: 100
        application:
          instance_types:
          - m7i.large
          desired_size: 1
          min_size: 1
          max_size: 8
          disk_size_gib: 100
      kafka:
        mode: msk
        msk_version: 3.7.x
        msk_brokers: 3
        msk_instance_type: kafka.m7g.xlarge
        msk_volume_size_gib: 100
      redis:
        mode: elasticache
        elasticache_node_type: cache.r7g.large
        elasticache_engine_version: '7.1'
        elasticache_nodes: 2
      observability:
        runner_peering: true
        runner_project: ckc-runner
        remote_write_port: 8428
        loki_port: 3100
        audit_port: 5170
