schema_version: 2
name: spring-ckc-replica-churn-5k-comparison
description: Compare Spring Kafka and CKC at 5k/s over two four-hour endurance targets while a two-replica split-host deployment repeatedly scales to three replicas and back to two.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      percentiles:
        p90: 20
        p95: 40
        p99: 80
        p100: 120
    flavour:
      percentiles:
        p90: 20
        p95: 40
        p99: 80
        p100: 120
    registry:
      percentiles:
        p90: 2
        p95: 3
        p99: 4
        p100: 5
  load:
    shards: 1
    base_tps: 5000
    producer_capacity_tps:
      order: 5000
      batch: 5000
      telemetry: 5000
    load_profile: 0 -> (3m, warmup) -> 100 -> (235m, replica-churn) -> 100 -> (2m, cool-down) -> 0
    cauldron_count: 32
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    workers: 100
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    telemetry_kafka_producer_linger_ms: 300
    telemetry_kafka_producer_batch_size: 131072
    order_kafka_producer_batch_size: 524288
    batch_kafka_producer_batch_size: 524288
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 5
    consumer_drain_timeout_seconds: 600
    consumer_drain_required: true
    telemetry_settle_seconds: 65
    maximum_first_sample_delay_seconds: 90
  measurement_window:
    name: replica-churn
    start: 3m
    duration: 235m
  chaos:
  - at: 3m
    duration: 235m
    type: sequence
    name: replica-churn
    steps:
    - type: deployment_scale
      params:
        replicas: 3
    - type: delay
      duration: 45s
    - type: deployment_scale
      params:
        replicas: 2
    - type: delay
      duration: 45s
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
      contract:
        delivery: at_least_once
        ordering: per_key
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
      contract:
        semantics: freshness_first
        delivery: not_guaranteed
        ordering: not_guaranteed
targets:
- name: spring-kafka.jdk.2-replica-churn
  annotation_label: Spring Kafka · 2↔3 pods · split host
  implementation: spring-kafka
  application:
    placement: worker
    replicas: 2
    resources:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        memory: 3Gi
    hpa:
      enabled: false
    java_options: -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: JDK
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 600
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 500
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 8192
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 250
    planning_latency:
      order_ms: 25
      batch_ms: 25
      telemetry_ms: 70
    parallelism:
    - partitions
    - pollers
    topics:
      order:
        partitions: 60
        pollers: 30
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        partitions: 48
        pollers: 24
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        partitions: 192
        pollers: 96
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: ckc.fixed.2-replica-churn
  annotation_label: CKC · 2↔3 pods · split host
  implementation: ckc
  application:
    placement: worker
    replicas: 2
    resources:
      requests:
        cpu: 1500m
        memory: 1Gi
      limits:
        memory: 3Gi
    hpa:
      enabled: false
    java_options: >-
      -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
      -Dcom.linecorp.armeria.defaultResponseTimeoutMillis=75000
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      MODEL_SYNC_HTTP_CLIENT: ARMERIA
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    parallelism:
    - partitions
    - workers
    - pollers
    topics:
      order:
        partitions: 6
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        partitions: 6
        workers: 500
        pollers: 1
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        partitions: 6
        workers: 500
        pollers: 1
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources:
          cpu_per_broker: 1
          memory_per_broker: 2Gi
          heap_per_broker: 1Gi
