schema_version: 2
name: ckc-fixed-four-pod-step-20k-local
description: >-
  Isolate late synchronized latency cascades from pod startup and HPA by warming four
  prestarted controlled-G1 CKC pods with a ten-minute linear ramp to 2k messages per
  second, stepping to 20k in one second, and holding full load for fifteen minutes.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub {percentiles: {p90: 10, p95: 20, p99: 40, p100: 60}}
    flavour: *fast_stub
    registry: {percentiles: {p90: 2, p95: 3, p99: 4, p100: 5}}
    deployment:
      replicas: 2
      workers: 4
      resources:
        requests: {cpu: 300m, memory: 384Mi}
        limits: {memory: 1Gi}
  load:
    shards: 1
    workers: 100
    dispatcher_threads: 2
    base_tps: 20000
    producer_capacity_tps: {order: 20000, batch: 20000, telemetry: 20000}
    load_profile: >-
      0 -> (10m, warmup-to-2k) -> 10 -> (1s, step-to-20k) -> 100 ->
      (15m, hold-20k) -> 100 -> (2m, cool-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 32768
    batch_kafka_producer_batch_size: 32768
    telemetry_kafka_producer_batch_size: 32768
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: true
    cpu_request: 1500m
    memory_request: 768Mi
    memory_limit: 1280Mi
    java_options: -Xms256m -Xmx768m -XX:+UseSerialGC
    consumer_drain_timeout_seconds: 300
    consumer_drain_required: false
    telemetry_settle_seconds: 300
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - {name: warmup-0-10m, start: 0m, duration: 10m}
  - {name: post-step-0-5m, start: 10m, duration: 5m}
  - {name: post-step-5-15m, start: 15m, duration: 10m}
  topics:
    order: {kafka_topic: order.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    batch: {kafka_topic: batch.events.v1, traffic_percent: 40, max_e2e_latency_ms: 2000}
    telemetry: {kafka_topic: cauldron.events.v1, traffic_percent: 20, max_e2e_latency_ms: 2000}
targets:
- name: ckc.fixed-four-pod-step-g1
  annotation_label: CKC · fixed 4 pods · controlled G1 · 2k→20k step
  implementation: ckc
  application:
    placement: worker
    replicas: 4
    resources:
      requests: {cpu: '1', memory: 512Mi}
      limits: {memory: 1280Mi}
    java_options: >-
      -Xms768m -Xmx768m -Xss256k -XX:+UseG1GC
      -XX:ParallelGCThreads=1 -XX:ConcGCThreads=1
      -XX:G1ConcRefinementThreads=1
      -Xlog:gc,gc+heap=debug,gc+age=trace,safepoint=info:stdout:time,uptime,level,tags
    hpa: {enabled: false}
  runtime:
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
    planning_latency: {order_ms: 8, batch_ms: 7, telemetry_ms: 21}
    parallelism: [workers]
    topics:
      order: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_NO_ORDERING}
      batch: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_NO_ORDERING}
      telemetry: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_NO_ORDERING}
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        transport: tls
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources: {cpu_per_broker: 1, memory_per_broker: 2Gi, heap_per_broker: 1Gi}
