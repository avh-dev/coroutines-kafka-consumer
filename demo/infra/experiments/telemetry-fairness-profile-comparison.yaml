schema_version: 1
name: telemetry-fairness-profile-comparison
description: Compare telemetry fairness on the same fixed-fleet overload test.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 45
      delay_p95_ms: 60
      delay_p99_ms: 165
      delay_p100_ms: 300
    flavour:
      delay_p90_ms: 4
      delay_p95_ms: 6
      delay_p99_ms: 8
      delay_p100_ms: 50
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    workers: 1
    base_tps: 2000
    order_event_percent: 0
    batch_event_percent: 0
    cauldron_telemetry_percent: 100
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (1m, warmup) -> 100 -> (12m, telemetry-fairness) -> 100 -> (1m, cool-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    diagnostics_blob_size: 256
acceptance:
  criteria:
  - id: no-missing-terminal
    title: Every published record has a terminal outcome
    source: audit
    path:
    - totals
    - missing_terminal
    operator: eq
    threshold: 0
    unit: records
  - id: no-duplicate-processing
    title: Records are not processed more than once
    source: audit
    path:
    - totals
    - duplicates
    - processed
    operator: eq
    threshold: 0
    unit: records
  - id: no-terminal-failures
    title: Records do not end in terminal processing failure
    source: audit
    path:
    - totals
    - failed
    operator: eq
    threshold: 0
    unit: records
  - id: no-processed-without-publish
    title: Processed records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - processed
    operator: eq
    threshold: 0
    unit: records
  - id: no-failed-without-publish
    title: Failed records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - failed
    operator: eq
    threshold: 0
    unit: records
  - id: no-dropped-without-publish
    title: Dropped records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - dropped
    operator: eq
    threshold: 0
    unit: records
  - id: no-conflicting-terminal-outcomes
    title: Records have only one terminal outcome
    source: audit
    path:
    - totals
    - conflicting_terminal_outcomes
    operator: eq
    threshold: 0
    unit: records
  latency:
    rules:
    - id: business-events
      title: Business event end-to-end latency
      topics:
      - order.events.v1
      - batch.events.v1
      max_ms: 2000
      allowed_exceed_percent: 1.0
    - id: telemetry
      title: Telemetry end-to-end latency
      topics:
      - cauldron.events.v1
      max_ms: 1000
      allowed_exceed_percent: 5.0
implementations:
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent_key: order_event_percent
    batch:
      kafka_topic: batch.events.v1
      traffic_percent_key: batch_event_percent
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent_key: cauldron_telemetry_percent
  profiles:
    ckc:
      spring_profile: ckc
      default_processing_dispatcher: FIXED
      allowed_processing_dispatchers:
      - DEFAULT
      - FIXED
      - IO
      - VIRTUAL
      topics:
        order:
          default_planning_latency_ms: 50
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: AT_LEAST_ONCE_KEY_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_PARTITION_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
        batch:
          default_planning_latency_ms: 50
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: AT_LEAST_ONCE_KEY_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_PARTITION_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
        telemetry:
          default_planning_latency_ms: 150
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
          allowed_processing_modes:
          - FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
          - FRESHNESS_FIRST_DROP_OLDEST
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
    confluent-reactor:
      extends: ckc
      spring_profile: confluent-parallel-reactor
      topics:
        telemetry:
          default_processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
          allowed_processing_modes:
          - HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_PARTITION_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
    spring-kafka-coroutines-naive:
      extends: ckc
      spring_profile: spring-kafka-coroutines-naive
      topics:
        order:
          default_processing_mode: AT_LEAST_ONCE_NO_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_NO_ORDERING
        batch:
          default_processing_mode: AT_LEAST_ONCE_NO_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_NO_ORDERING
        telemetry:
          default_processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
          allowed_processing_modes:
          - HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
defaults:
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
targets:
- runtime:
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
  name: ckc.fixed.2
  implementation: ckc
- runtime:
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
  name: cpc-reactor.fixed.2
  implementation: confluent-reactor
- runtime:
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
  name: spring-kafka-coroutines-naive.fixed.2
  implementation: spring-kafka-coroutines-naive
environments:
  internal-lab:
    lab:
      profile: installed
