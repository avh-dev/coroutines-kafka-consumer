schema_version: 2
name: telemetry-fairness-profile-comparison
description: Compare telemetry fairness on the same fixed-fleet overload test.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 45
      delay_p95_ms: 60
      delay_p99_ms: 165
      delay_p100_ms: 300
    flavour:
      delay_p90_ms: 4
      delay_p95_ms: 6
      delay_p99_ms: 8
      delay_p100_ms: 50
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    workers: 1
    base_tps: 2000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (1m, warmup) -> 100 -> (12m, telemetry-fairness) -> 100 ->
      (1m, cool-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    diagnostics_blob_size: 256
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 0
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 0
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 100
      max_e2e_latency_ms: 1000
targets:
- name: ckc.fixed.2
  implementation: ckc
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
- name: cpc-reactor.fixed.2
  implementation: confluent-reactor
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka-coroutines-naive.fixed.2
  implementation: spring-kafka-coroutines-naive
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 2
      batch_ms: 5
      telemetry_ms: 35
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
environments:
  internal-lab:
    lab:
      profile: installed
