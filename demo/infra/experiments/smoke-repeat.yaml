schema_version: 1
name: smoke-repeat
description: Run the short smoke definition twice to validate experiment orchestration.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    flavour:
      delay_p90_ms: 20
      delay_p95_ms: 40
      delay_p99_ms: 80
      delay_p100_ms: 120
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    base_tps: 100
    order_event_percent: 35
    batch_event_percent: 25
    cauldron_telemetry_percent: 40
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    load_profile: 0 -> (10s, warmup) -> 100 -> (60s, smoke) -> 100 -> (10s, cool-down) -> 0
    cauldron_count: 2
    min_orders_per_batch: 2
    max_orders_per_batch: 3
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
acceptance:
  criteria:
  - id: no-missing-terminal
    title: Every published record has a terminal outcome
    source: audit
    path:
    - totals
    - missing_terminal
    operator: eq
    threshold: 0
    unit: records
  - id: no-duplicate-processing
    title: Records are not processed more than once
    source: audit
    path:
    - totals
    - duplicates
    - processed
    operator: eq
    threshold: 0
    unit: records
  - id: no-terminal-failures
    title: Records do not end in terminal processing failure
    source: audit
    path:
    - totals
    - failed
    operator: eq
    threshold: 0
    unit: records
  - id: no-processed-without-publish
    title: Processed records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - processed
    operator: eq
    threshold: 0
    unit: records
  - id: no-failed-without-publish
    title: Failed records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - failed
    operator: eq
    threshold: 0
    unit: records
  - id: no-dropped-without-publish
    title: Dropped records have matching publishes
    source: audit
    path:
    - totals
    - without_publish
    - dropped
    operator: eq
    threshold: 0
    unit: records
  - id: no-conflicting-terminal-outcomes
    title: Records have only one terminal outcome
    source: audit
    path:
    - totals
    - conflicting_terminal_outcomes
    operator: eq
    threshold: 0
    unit: records
  latency:
    rules:
    - id: business-events
      title: Business event end-to-end latency
      topics:
      - order.events.v1
      - batch.events.v1
      max_ms: 2000
      allowed_exceed_percent: 1.0
    - id: telemetry
      title: Telemetry end-to-end latency
      topics:
      - cauldron.events.v1
      max_ms: 1000
      allowed_exceed_percent: 5.0
implementations:
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent_key: order_event_percent
    batch:
      kafka_topic: batch.events.v1
      traffic_percent_key: batch_event_percent
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent_key: cauldron_telemetry_percent
  profiles:
    ckc:
      spring_profile: ckc
      default_processing_dispatcher: FIXED
      allowed_processing_dispatchers:
      - DEFAULT
      - FIXED
      - IO
      - VIRTUAL
      topics:
        order:
          default_planning_latency_ms: 50
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: AT_LEAST_ONCE_KEY_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_PARTITION_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
        batch:
          default_planning_latency_ms: 50
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: AT_LEAST_ONCE_KEY_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_PARTITION_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
        telemetry:
          default_planning_latency_ms: 150
          parallelism:
          - workers
          mode_parallelism:
            AT_LEAST_ONCE_PARTITION_ORDERING:
            - partitions
            - workers
          default_processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
          allowed_processing_modes:
          - FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
          - FRESHNESS_FIRST_DROP_OLDEST
          - AT_LEAST_ONCE_KEY_ORDERING
          - AT_LEAST_ONCE_NO_ORDERING
defaults:
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      LOAD_TEST_WORKERS: 1
targets:
- runtime:
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
  name: ckc-smoke-1
  implementation: ckc
- runtime:
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
  name: ckc-smoke-2
  implementation: ckc
environments:
  internal-lab:
    lab:
      profile: installed
