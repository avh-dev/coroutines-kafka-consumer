schema_version: 2
name: smoke-repeat
description: Run one one-minute smoke target to validate experiment orchestration and report generation.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      percentiles:
        p90: 20
        p95: 40
        p99: 80
        p100: 120
    flavour:
      percentiles:
        p90: 20
        p95: 40
        p99: 80
        p100: 120
    registry:
      percentiles:
        p90: 2
        p95: 3
        p99: 4
        p100: 5
  load:
    shards: 1
    workers: 2
    base_tps: 1000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    load_profile: 0 -> (10s, warmup) -> 100 -> (40s, maximum) -> 100 -> (10s, cool-down)
      -> 0
    cauldron_count: 2
    min_orders_per_batch: 2
    max_orders_per_batch: 3
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 5
  measurement_window:
    name: max-load
    start: 20s
    duration: 30s
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
  diagnostics:
  - at: 30s
    type: tcpdump
    name: max-load
    targets:
    - application
    - load-test
    duration: 10s
    params:
      interface: auto
      snaplen: 0
      filter: tcp port 9092
      max_file_size: 128Mi
    required: true
targets:
- name: ckc-smoke-1
  implementation: ckc
  application:
    replicas: 2
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      LOAD_TEST_WORKERS: 1
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
    topics:
      order:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      batch:
        processing_mode: AT_LEAST_ONCE_KEY_ORDERING
      telemetry:
        processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
environments:
  internal-lab:
    lab:
      profile: installed
