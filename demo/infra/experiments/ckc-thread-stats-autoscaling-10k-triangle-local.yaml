schema_version: 2
name: ckc-thread-stats-autoscaling-10k-triangle-local
description: >-
  Measure CKC autoscaling with Thread Stats CPU excluding native JIT under a
  profile that ramps from zero to 10k/s over ten minutes, holds maximum load for
  five minutes, and ramps back to zero over ten minutes on small 400m pods.
workload:
  stubs:
    error_rate_percent: 0
    eta: &fast_stub {percentiles: {p90: 10, p95: 20, p99: 40, p100: 60}}
    flavour: *fast_stub
    registry: {percentiles: {p90: 2, p95: 3, p99: 4, p100: 5}}
    deployment:
      replicas: 2
      workers: 4
      resources:
        requests: {cpu: 300m, memory: 384Mi}
        limits: {memory: 1Gi}
  load:
    shards: 1
    workers: 100
    dispatcher_threads: 2
    base_tps: 10000
    producer_capacity_tps: {order: 10000, batch: 10000, telemetry: 10000}
    load_profile: 0 -> (10m, linear-ramp-up) -> 100 -> (5m, steady) -> 100 -> (10m, linear-ramp-down) -> 0
    cauldron_count: 10000
    min_orders_per_batch: 3
    max_orders_per_batch: 6
    min_brewing_steps: 5
    max_brewing_steps: 8
    diagnostics_blob_size: 64
    stats_log_interval_seconds: 15
    kafka_producer_linger_ms: 300
    kafka_producer_batch_size: 32768
    kafka_producer_compression_type: lz4
    kafka_producer_buffer_memory: 67108864
    order_kafka_producer_batch_size: 32768
    batch_kafka_producer_batch_size: 32768
    telemetry_kafka_producer_batch_size: 32768
    telemetry_source_mode: FLEET
    telemetry_publish_interval_seconds: 1
    audit_log_enabled: true
    cpu_request: 1500m
    memory_request: 768Mi
    memory_limit: 1280Mi
    java_options: -Xms256m -Xmx768m -XX:+UseSerialGC
    consumer_drain_timeout_seconds: 90
    consumer_drain_required: false
    telemetry_settle_seconds: 180
    maximum_first_sample_delay_seconds: 90
  measurement_windows:
  - name: ramp-up
    start: 0m
    duration: 10m
  - name: steady
    start: 12m30s
    duration: 2m30s
  - name: ramp-down
    start: 15m
    duration: 10m
  topics:
    order: {kafka_topic: order.events.v1, traffic_percent: 40, max_e2e_latency_ms: 1000}
    batch: {kafka_topic: batch.events.v1, traffic_percent: 40, max_e2e_latency_ms: 1000}
    telemetry: {kafka_topic: cauldron.events.v1, traffic_percent: 20, max_e2e_latency_ms: 1000}
targets:
- name: ckc.thread-stats-no-jit
  annotation_label: CKC · smoothed total Thread Stats CPU without JIT · local 10k
  implementation: ckc
  application:
    placement: worker
    replicas: 1
    resources:
      requests: {cpu: 400m, memory: 512Mi}
      limits: {memory: 1280Mi}
    java_options: -Xms256m -Xmx768m -Xss256k -XX:+UseSerialGC
    hpa:
      enabled: true
      min_replicas: 1
      max_replicas: 12
      hot_pod_cpu:
        enabled: true
        source: thread_stats_excluding_jit
        strategy: replica_demand
        replace_cpu_trigger: true
        target_utilization_percentage: 85
        averaging_window: 30s
        observation_window: 1m
        query_step: 15s
        aggregation: average
        polling_interval_seconds: 15
        scale_up: {max_pods: 2, period_seconds: 60, tolerance: 0.1}
        scale_down: {max_pods: 1, period_seconds: 60, stabilization_window_seconds: 60}
  runtime:
    env:
      DEMO_CONSUMER_PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: true
      METRICS_IMPLEMENTATION: MICROMETER
      KAFKA_CLIENT_METRICS_ENABLED: false
      SPRING_KAFKA_LISTENER_METRICS_ENABLED: false
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_CONSUMER_FETCH_MAX_BYTES: 52428800
      KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES: 1048576
      TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES: 16384
      TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 350
    planning_latency: {order_ms: 8, batch_ms: 7, telemetry_ms: 21}
    parallelism: [workers]
    topics:
      order: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      batch: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: AT_LEAST_ONCE_KEY_ORDERING}
      telemetry: {partitions: 12, workers: 500, queue_capacity: 4096, processing_mode: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY}
environments:
  internal-lab:
    lab:
      profile: installed
      kafka:
        implementation: apache-kafka
        topology: cluster
        transport: tls
        brokers: 3
        replication_factor: 3
        min_insync_replicas: 2
        resources: {cpu_per_broker: 1, memory_per_broker: 2Gi, heap_per_broker: 1Gi}
