schema_version: 2
name: spring-kafka-thread-stats-progression
description: Compare Spring Kafka poller and worker-thread placement for Thread Stats
  documentation screenshots.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 25
      delay_p95_ms: 40
      delay_p99_ms: 160
      delay_p100_ms: 300
    flavour:
      delay_p90_ms: 4
      delay_p95_ms: 6
      delay_p99_ms: 8
      delay_p100_ms: 50
    registry:
      delay_p90_ms: 2
      delay_p95_ms: 3
      delay_p99_ms: 4
      delay_p100_ms: 5
  load:
    shards: 1
    workers: 8
    base_tps: 5000
    producer_capacity_tps:
      order: 1000
      batch: 1000
      telemetry: 1000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (3m, warmup) -> 100 -> (6m, maximum) -> 100 -> (1m, cool-down)
      -> 0
    cauldron_count: 75
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    diagnostics_blob_size: 256
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 35
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 25
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 40
      max_e2e_latency_ms: 1000
targets:
- name: spring-kafka
  implementation: spring-kafka
  application:
    replicas: 1
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: false
      METRICS_IMPLEMENTATION: MICROMETER
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_PRODUCER_LINGER_MS: 500
      KAFKA_PRODUCER_BATCH_SIZE: 131072
      KAFKA_PRODUCER_COMPRESSION_TYPE: lz4
      KAFKA_PRODUCER_BUFFER_MEMORY: 134217728
    planning_latency:
      order_ms: 10
      batch_ms: 10
      telemetry_ms: 55
    topics:
      order:
        queue_capacity: 4000
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        queue_capacity: 4000
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        queue_capacity: 4000
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
- name: spring-kafka-thread-pool.partitions-pollers-and-workers
  implementation: spring-kafka-thread-pool
  application:
    replicas: 1
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: false
      METRICS_IMPLEMENTATION: MICROMETER
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
      KAFKA_PRODUCER_LINGER_MS: 500
      KAFKA_PRODUCER_BATCH_SIZE: 131072
      KAFKA_PRODUCER_COMPRESSION_TYPE: lz4
      KAFKA_PRODUCER_BUFFER_MEMORY: 134217728
    planning_latency:
      order_ms: 10
      batch_ms: 10
      telemetry_ms: 55
    topics:
      order:
        queue_capacity: 4000
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      batch:
        queue_capacity: 4000
        processing_mode: AT_LEAST_ONCE_NO_ORDERING
      telemetry:
        queue_capacity: 4000
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    parallelism:
    - partitions
    - pollers
    - workers
