schema_version: 2
name: spring-kafka-linger-sweep-comparison
description: Compare latency, batching, and wire compression across fixed five-minute
  Spring Kafka targets using linger.ms values from 0 to 1000 ms with LZ4 and no compression.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
    flavour:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
    registry:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
  load:
    shards: 1
    workers: 1
    base_tps: 5000
    producer_capacity_tps:
      order: 5000
      batch: 5000
      telemetry: 5000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (1m, warmup) -> 100 -> (3m, steady) -> 100 -> (1m, cool-down)
      -> 0
    cauldron_count: 5000
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    max_burst: 1000
    diagnostics_blob_size: 256
    kafka_producer_batch_size: 1048576
    kafka_producer_buffer_memory: 268435456
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent: 0
      max_e2e_latency_ms: 2000
    batch:
      kafka_topic: batch.events.v1
      traffic_percent: 0
      max_e2e_latency_ms: 2000
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent: 100
      max_e2e_latency_ms: 1000
  diagnostics:
  - at: 3m
    type: tcpdump
    name: kafka-steady
    targets:
    - application
    - load-test
    duration: 5s
    params:
      interface: auto
      snaplen: 0
      filter: tcp port 9092
      max_file_size: 128Mi
    required: true
targets:
- name: spring.many-consumers.none.linger0
  implementation: spring-kafka
  application:
    replicas: 1
    resources:
      requests:
        cpu: '2'
        memory: 2Gi
    java_options: -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: false
      METRICS_IMPLEMENTATION: MICROMETER
      LETTUCE_METRICS_ENABLED: true
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      EXPERIMENT_GRAFANA_ANNOTATIONS_ENABLED: false
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 1000
      KAFKA_PRODUCER_COMPRESSION_TYPE: none
      KAFKA_PRODUCER_LINGER_MS: 0
    planning_latency:
      order_ms: 8
      batch_ms: 8
      telemetry_ms: 8
    topics:
      order:
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      batch:
        queue_capacity: 4096
        processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry:
        queue_capacity: 8192
        partitions: 200
        pollers: 200
        processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    parallelism:
    - partitions
    - pollers
  annotation_label: compression.type=none · linger.ms=0
