schema_version: 1
name: spring-kafka-linger-sweep-comparison
description: Compare latency, batching, and wire compression across fixed five-minute Spring Kafka targets using linger.ms
  values from 0 to 1000 ms with LZ4 and no compression.
workload:
  stubs:
    error_rate_percent: 0
    eta:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
    flavour:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
    registry:
      delay_p90_ms: 1
      delay_p95_ms: 1
      delay_p99_ms: 1
      delay_p100_ms: 1
  load:
    shards: 1
    workers: 1
    base_tps: 5000
    order_event_percent: 0
    batch_event_percent: 0
    cauldron_telemetry_percent: 100
    producer_capacity_tps:
      order: 5000
      batch: 5000
      telemetry: 5000
    telemetry_source_mode: FIXED_FLEET
    load_profile: 0 -> (1m, warmup) -> 100 -> (3m, steady) -> 100 -> (1m, cool-down) -> 0
    cauldron_count: 5000
    min_orders_per_batch: 4
    max_orders_per_batch: 8
    min_brewing_steps: 5
    max_brewing_steps: 10
    max_burst: 1000
    diagnostics_blob_size: 256
    kafka_producer_batch_size: 1048576
    kafka_producer_buffer_memory: 268435456
  diagnostics:
  - at: 3m
    type: tcpdump
    name: kafka-steady
    targets:
    - application
    - load-test
    duration: 5s
    params:
      interface: auto
      snaplen: 0
      filter: tcp port 9092
      max_file_size: 128Mi
    required: true
acceptance:
  criteria:
  - id: sustained-throughput
    title: Average processed throughput is at least 4.5K records/s
    source: measurement
    measurement: throughput_average_rps
    operator: gte
    threshold: 4500
    unit: records/s
implementations:
  topics:
    order:
      kafka_topic: order.events.v1
      traffic_percent_key: order_event_percent
    batch:
      kafka_topic: batch.events.v1
      traffic_percent_key: batch_event_percent
    telemetry:
      kafka_topic: cauldron.events.v1
      traffic_percent_key: cauldron_telemetry_percent
  profiles:
    spring-kafka:
      spring_profile: spring-kafka
      topics:
        order:
          default_planning_latency_ms: 25
          parallelism:
          - partitions
          - pollers
          default_processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_PARTITION_ORDERING
        batch:
          default_planning_latency_ms: 25
          parallelism:
          - partitions
          - pollers
          default_processing_mode: AT_LEAST_ONCE_PARTITION_ORDERING
          allowed_processing_modes:
          - AT_LEAST_ONCE_PARTITION_ORDERING
        telemetry:
          default_planning_latency_ms: 70
          parallelism:
          - partitions
          - pollers
          default_processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
          allowed_processing_modes:
          - HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
defaults:
  application:
    replicas: 1
    resources:
      requests:
        cpu: '2'
        memory: 2Gi
    java_options: -Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC
  runtime:
    env:
      PROCESSING_ENABLED: true
      AUDIT_LOG_ENABLED: false
      METRICS_IMPLEMENTATION: MICROMETER
      LETTUCE_METRICS_ENABLED: true
      JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
      EXPERIMENT_GRAFANA_ANNOTATIONS_ENABLED: false
      KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
      KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 1000
    planning_latency:
      order_ms: 8
      batch_ms: 8
      telemetry_ms: 8
    topics:
      order:
        queue_capacity: 4096
      batch:
        queue_capacity: 4096
      telemetry:
        queue_capacity: 8192
targets:
- runtime:
    env:
      KAFKA_PRODUCER_COMPRESSION_TYPE: none
      KAFKA_PRODUCER_LINGER_MS: 0
    parallelism:
    - partitions
    - pollers
    topics:
      telemetry:
        partitions: 200
        pollers: 200
  name: spring.many-consumers.none.linger0
  annotation_label: compression.type=none · linger.ms=0
  implementation: spring-kafka
- runtime:
    env:
      KAFKA_PRODUCER_COMPRESSION_TYPE: lz4
      KAFKA_PRODUCER_LINGER_MS: 0
    parallelism:
    - partitions
    - pollers
    topics:
      telemetry:
        partitions: 200
        pollers: 200
  name: spring.many-consumers.lz4.linger0
