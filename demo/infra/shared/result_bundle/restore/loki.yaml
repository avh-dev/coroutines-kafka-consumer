auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  # Restoring a bundle is a bounded local bulk import, not a live multi-tenant
  # workload. Leave enough headroom for large experiment log snapshots.
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
ingester:
  max_chunk_age: 720h
compactor:
  working_directory: /loki/compactor
