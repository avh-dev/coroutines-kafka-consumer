name: ckc-baseline

deployment:
  app_profile: ckc-hpa
  stubs_profile: baseline
  kafka_topics:
    - name: order.events.v1
      partitions: 12
    - name: batch.events.v1
      partitions: 12
    - name: cauldron.events.v1
      partitions: 12

load_test:
  shards: 4
  lifecycle_base_rate: 2000
  telemetry_base_rate: 20000
  load_profile: "0 -> (2m, warmup) -> 60 -> (8m, comparison) -> 100 -> (2m, cool-down) -> 0"
  lifecycle_orders_per_batch: 3
  telemetry_interval_seconds: 10
  tick_interval_millis: 200
  diagnostics_blob_size: 512
