name: smoke-test

deployment:
  app_profile: ckc-single
  stubs_profile: fast
  kafka_topics:
    - name: order.events.v1
      partitions: 1
    - name: batch.events.v1
      partitions: 1
    - name: cauldron.events.v1
      partitions: 1

load_test:
  shards: 1
  base_tps: 10
  order_event_percent: 35
  batch_event_percent: 25
  cauldron_telemetry_percent: 40
  load_profile: "0 -> (10s, warmup) -> 100 -> (60s, smoke) -> 100 -> (10s, cool-down) -> 0"
  cauldron_count: 2
  min_orders_per_batch: 2
  max_orders_per_batch: 3
  min_brewing_steps: 5
  max_brewing_steps: 8
  diagnostics_blob_size: 64
