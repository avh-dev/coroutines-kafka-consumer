replicaCount: 1
runId: local
runProfile: stubs

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  port: 8080

env:
  redisHost: localhost
  redisPort: 6379

resources: {}

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationWindowSeconds: 300
