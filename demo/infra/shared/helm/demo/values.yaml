replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  port: 8080
  type: ClusterIP
  nodePort: null

env:
  springProfilesActive: ckc
  kafkaEnabled: true
  demoKafkaEnabled: true
  bootstrapServers: ""
  redisHost: ""
  redisPort: 6379
  javaToolOptions: ""
  modelBaseUrl: ""
  processingEnabled: true
  metricsImplementation: MICROMETER
  kafkaConsumerFetchMinBytes: 8192
  kafkaConsumerFetchMaxWaitMs: 250
  kafkaConsumerMaxPollRecords: 500
  auditLogEnabled: true
  auditLogDir: .demo-audit
  auditLogFilePrefix: ""
  auditQueueCapacity: 65536
  auditFlushRecords: 1024
  auditFlushIntervalMs: 50
  auditFsyncIntervalMs: 1000
  auditMaxSegmentBytes: "268435456"
  orderProcessingMode: AT_LEAST_ONCE_UNORDERED
  orderWorkerConcurrency: 2
  orderPollLoopConcurrency: 1
  orderWorkChannelCapacity: 1024
  batchProcessingMode: AT_LEAST_ONCE_UNORDERED
  batchWorkerConcurrency: 2
  batchPollLoopConcurrency: 1
  batchWorkChannelCapacity: 1024
  telemetryProcessingMode: FRESHNESS_FIRST
  telemetryWorkerConcurrency: 4
  telemetryPollLoopConcurrency: 1
  telemetryWorkChannelCapacity: 256

resources: {}

auditVolume:
  enabled: false
  hostPath: ""
  mountPath: /var/lib/ckc-audit

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
  startup:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

hostAliases: []
