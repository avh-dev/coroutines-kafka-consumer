replicaCount: 3

lab:
  kafkaTopics:
    - name: order.events.v1
      partitions: 6
    - name: batch.events.v1
      partitions: 6
    - name: cauldron.events.v1
      partitions: 75

env:
  springProfilesActive: spring-kafka
  orderProcessingMode: AT_LEAST_ONCE_ORDERED_BY_PARTITION
  batchProcessingMode: AT_LEAST_ONCE_ORDERED_BY_PARTITION
  orderPollLoopConcurrency: 2
  telemetryPollLoopConcurrency: 25
  batchPollLoopConcurrency: 2


resources:
  requests:
    cpu: "1"
    memory: 1Gi

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 8
  startup:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 30

hpa:
  enabled: false
