services:
  warmup-kafka:
    build: ..
    image: ckc-perf/warmup-kafka:latest
    ports:
      - "29092:9092"
    environment:
      CLUSTER_ID: M8gW-iVjQkGqC1rH0vM4xA
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:19092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_BOOTSTRAP_TOPICS: >-
        ckc.traffic-warmup.v6.control,
        ckc.traffic-warmup.v6.order.events,
        ckc.traffic-warmup.v6.batch.events,
        ckc.traffic-warmup.v6.cauldron.events
    healthcheck:
      test: ["CMD", "/opt/ckc-warmup-kafka/bin/readiness.sh"]
      interval: 2s
      timeout: 1s
      retries: 30
