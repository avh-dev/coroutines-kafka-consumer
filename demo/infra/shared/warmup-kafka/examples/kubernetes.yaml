apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckc-warmup-kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-warmup-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-warmup-kafka
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: ckc-perf/warmup-kafka:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: CLUSTER_ID, value: M8gW-iVjQkGqC1rH0vM4xA}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://localhost:19092,EXTERNAL://ckc-warmup-kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - name: KAFKA_BOOTSTRAP_TOPICS
              value: ckc.traffic-warmup.v6.control,ckc.traffic-warmup.v6.order.events,ckc.traffic-warmup.v6.batch.events,ckc.traffic-warmup.v6.cauldron.events
          readinessProbe:
            exec:
              command: [/opt/ckc-warmup-kafka/bin/readiness.sh]
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-warmup-kafka
spec:
  selector:
    app.kubernetes.io/name: ckc-warmup-kafka
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
