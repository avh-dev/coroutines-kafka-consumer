name: chaos-smoke

stubs:
  error_rate_percent: 0
  eta:
    delay_p90_ms: 20
    delay_p95_ms: 40
    delay_p99_ms: 80
    delay_p100_ms: 120
  flavour:
    delay_p90_ms: 20
    delay_p95_ms: 40
    delay_p99_ms: 80
    delay_p100_ms: 120
  registry:
    delay_p90_ms: 2
    delay_p95_ms: 3
    delay_p99_ms: 4
    delay_p100_ms: 5

chaos_steps:
  - at: 45s
    type: pod_delete
    target: ckc-demo
  - at: 90s
    duration: 90s
    type: stubs_degradation
    target: demo-stubs
    params:
      error_rate_percent: 5
      eta:
        delay_p90_ms: 200
        delay_p95_ms: 400
        delay_p99_ms: 800
        delay_p100_ms: 1200
      flavour:
        delay_p90_ms: 200
        delay_p95_ms: 400
        delay_p99_ms: 800
        delay_p100_ms: 1200
      registry:
        delay_p90_ms: 20
        delay_p95_ms: 40
        delay_p99_ms: 80
        delay_p100_ms: 120
  - at: 120s
    type: pod_crash
    target: ckc-demo

load_test:
  shards: 1
  base_tps: 20
  order_event_percent: 35
  batch_event_percent: 25
  cauldron_telemetry_percent: 40
  producer_capacity_tps:
    order: 1000
    batch: 1000
    telemetry: 1000
  load_profile: "0 -> (20s, warmup) -> 100 -> (3m, chaos-smoke) -> 100 -> (30s, cool-down) -> 0"
  cauldron_count: 2
  min_orders_per_batch: 2
  max_orders_per_batch: 3
  min_brewing_steps: 5
  max_brewing_steps: 8
  diagnostics_blob_size: 64
