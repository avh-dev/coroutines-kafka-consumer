name: packet-capture-smoke

stubs:
  error_rate_percent: 0
  eta:
    delay_p90_ms: 20
    delay_p95_ms: 40
    delay_p99_ms: 80
    delay_p100_ms: 120
  flavour:
    delay_p90_ms: 20
    delay_p95_ms: 40
    delay_p99_ms: 80
    delay_p100_ms: 120
  registry:
    delay_p90_ms: 2
    delay_p95_ms: 3
    delay_p99_ms: 4
    delay_p100_ms: 5

diagnostic_steps:
  - at: 10s
    type: tcpdump
    name: kafka-traffic
    targets: [application, load-test]
    duration: 5s
    params:
      interface: auto
      snaplen: 0
      filter: tcp port 9092
      max_file_size: 64Mi
    required: true

load_test:
  shards: 1
  base_tps: 10
  order_event_percent: 35
  batch_event_percent: 25
  cauldron_telemetry_percent: 40
  producer_capacity_tps:
    order: 1000
    batch: 1000
    telemetry: 1000
  load_profile: "0 -> (10s, warmup) -> 100 -> (30s, capture) -> 100 -> (10s, cool-down) -> 0"
  cauldron_count: 2
  min_orders_per_batch: 2
  max_orders_per_batch: 3
  min_brewing_steps: 5
  max_brewing_steps: 8
  diagnostics_blob_size: 64
