name: consumer-baseline
description: Require delivery integrity and bounded end-to-end latency for processed consumer records.
extends: delivery-integrity

latency:
  rules:
    - id: business-events
      title: Business event end-to-end latency
      topics:
        - order.events.v1
        - batch.events.v1
      max_ms: 2000
      allowed_exceed_percent: 1.0

    - id: telemetry
      title: Telemetry end-to-end latency
      topics:
        - cauldron.events.v1
      max_ms: 1000
      allowed_exceed_percent: 5.0
