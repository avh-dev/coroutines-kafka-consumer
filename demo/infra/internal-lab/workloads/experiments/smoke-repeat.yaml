name: smoke-repeat
description: Run the short smoke definition twice to validate experiment orchestration.
test_definition: smoke
base_tps: 100

defaults:
  replicas: 2
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: true
    METRICS_IMPLEMENTATION: MICROMETER
    LOAD_TEST_WORKERS: 1

targets:
  - name: ckc-smoke-1
    profile: ckc
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2

  - name: ckc-smoke-2
    profile: ckc
    planning_latency:
      order_ms: 51.8
      batch_ms: 5.16
      telemetry_ms: 3.0
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
