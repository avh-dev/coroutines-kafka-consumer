name: ckc-sync-dispatcher-comparison
description: Compare suspend CKC, CKC sync Dispatchers.IO, and CKC sync virtual-thread dispatcher mode on the same baseline test.
test_definition: 6min
base_tps: 12000

defaults:
  replicas: 2
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: true
    METRICS_IMPLEMENTATION: MICROMETER

targets:
  - name: ckc.fixed.2
    profile: ckc
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1

  - name: ckc-sync.io
    profile: ckc-sync
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150

  - name: ckc-sync.virtual-thread
    profile: ckc-sync
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
    env:
      PROCESSING_DISPATCHER_TYPE: VIRTUAL
