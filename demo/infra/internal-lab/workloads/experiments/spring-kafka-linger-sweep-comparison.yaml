name: spring-kafka-linger-sweep-comparison
description: Compare latency, batching, and wire compression across fixed five-minute Spring Kafka targets using linger.ms values from 0 to 1000 ms with LZ4 and no compression.
base_tps: 5000
sla_profile: kafka-compression-parallelism

test:
  extends: kafka-compression-parallelism
  load_test:
    load_profile: "0 -> (1m, warmup) -> 100 -> (3m, steady) -> 100 -> (1m, cool-down) -> 0"
    kafka_producer_batch_size: 1048576
    kafka_producer_buffer_memory: 268435456
  diagnostic_steps:
    - at: 3m
      type: tcpdump
      name: kafka-steady
      targets: [application, load-test]
      duration: 5s
      params:
        interface: auto
        snaplen: 0
        filter: tcp port 9092
        max_file_size: 128Mi
      required: true

defaults:
  replicas: 1
  planning_latency:
    order_ms: 8
    batch_ms: 8
    telemetry_ms: 8
  order_queue_capacity: 4096
  batch_queue_capacity: 4096
  telemetry_queue_capacity: 8192
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: false
    METRICS_IMPLEMENTATION: MICROMETER
    LETTUCE_METRICS_ENABLED: true
    JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
    EXPERIMENT_GRAFANA_ANNOTATIONS_ENABLED: false
    KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
    KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
    KAFKA_CONSUMER_MAX_POLL_RECORDS: 1000
  helm:
    env:
      javaToolOptions: "-Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC"
    resources:
      requests:
        cpu: "2"
        memory: 2Gi

targets:
  - name: spring.many-consumers.lz4.linger0
    profile: spring-kafka
    parallelism: [partitions, pollers]
    telemetry_partitions: 200
    telemetry_pollers: 200
    env:
      KAFKA_PRODUCER_COMPRESSION_TYPE: lz4
      KAFKA_PRODUCER_LINGER_MS: 0

  - name: spring.many-consumers.lz4.linger100
