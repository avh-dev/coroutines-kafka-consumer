name: spring-kafka-linger-sweep-comparison
description: Compare latency, batching, and wire compression while Spring Kafka telemetry producers sweep linger.ms from 0 to 1000 ms with LZ4 and no compression.
base_tps: 5000
sla_profile: kafka-compression-parallelism

test:
  extends: kafka-compression-parallelism
  load_test:
    load_profile: "0 -> (2m, warmup-linger0) -> 100 -> (10m, linger-sweep) -> 100 -> (1m, cool-down) -> 0"
    kafka_producer_linger_ms: 0
    kafka_producer_batch_size: 1048576
    kafka_producer_buffer_memory: 268435456
    producer_config_steps:
      - at: 2m
        topic: all
        linger_ms: 100
      - at: 3m
        topic: all
        linger_ms: 200
      - at: 4m
        topic: all
        linger_ms: 300
      - at: 5m
        topic: all
        linger_ms: 400
      - at: 6m
        topic: all
        linger_ms: 500
      - at: 7m
        topic: all
        linger_ms: 600
      - at: 8m
        topic: all
        linger_ms: 700
      - at: 9m
        topic: all
        linger_ms: 800
      - at: 10m
        topic: all
        linger_ms: 900
      - at: 11m
        topic: all
        linger_ms: 1000
  diagnostic_steps:
    - at: 2m30s
      type: tcpdump
      name: kafka-linger100
      targets: [application, load-test]
      duration: 5s
      params:
        interface: auto
        snaplen: 0
        filter: tcp port 9092
        max_file_size: 128Mi
      required: true
    - at: 7m30s
      type: tcpdump
      name: kafka-linger600
      targets: [application, load-test]
      duration: 5s
      params:
        interface: auto
        snaplen: 0
        filter: tcp port 9092
        max_file_size: 128Mi
      required: true
    - at: 11m30s
      type: tcpdump
      name: kafka-linger1000
      targets: [application, load-test]
      duration: 5s
      params:
        interface: auto
        snaplen: 0
        filter: tcp port 9092
        max_file_size: 128Mi
      required: true

defaults:
  replicas: 1
  planning_latency:
    order_ms: 8
    batch_ms: 8
    telemetry_ms: 8
  order_queue_capacity: 4096
  batch_queue_capacity: 4096
  telemetry_queue_capacity: 8192
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: false
    METRICS_IMPLEMENTATION: MICROMETER
    LETTUCE_METRICS_ENABLED: true
    JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
    KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
    KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
    KAFKA_CONSUMER_MAX_POLL_RECORDS: 1000
  helm:
    env:
      javaToolOptions: "-Xms512m -Xmx1536m -Xss256k -XX:+UseSerialGC"
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 3Gi

targets:
  - name: spring.many-consumers.lz4.linger-sweep
    profile: spring-kafka
    parallelism: [partitions, pollers]
    telemetry_partitions: 200
    telemetry_pollers: 200
    env:
      KAFKA_PRODUCER_COMPRESSION_TYPE: lz4

  - name: spring.many-consumers.none.linger-sweep
    profile: spring-kafka
    parallelism: [partitions, pollers]
    telemetry_partitions: 200
    telemetry_pollers: 200
    env:
      KAFKA_PRODUCER_COMPRESSION_TYPE: none
