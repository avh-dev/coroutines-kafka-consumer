name: spring-kafka-thread-stats-progression
description: Compare Spring Kafka poller and worker-thread placement for Thread Stats documentation screenshots.
test_definition: 10min
base_tps: 5000

defaults:
  replicas: 1
  planning_latency:
    order_ms: 10
    batch_ms: 10
    telemetry_ms: 55
  order_queue_capacity: 4000
  batch_queue_capacity: 4000
  telemetry_queue_capacity: 4000
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: false
    METRICS_IMPLEMENTATION: MICROMETER
    JDK_HTTP_CLIENT_EXECUTOR: DEFAULT
    KAFKA_CONSUMER_FETCH_MIN_BYTES: 65536
    KAFKA_CONSUMER_FETCH_MAX_WAIT_MS: 100
    KAFKA_CONSUMER_MAX_POLL_RECORDS: 2000
    KAFKA_PRODUCER_LINGER_MS: 50
    KAFKA_PRODUCER_BATCH_SIZE: 131072
    KAFKA_PRODUCER_COMPRESSION_TYPE: lz4
    KAFKA_PRODUCER_BUFFER_MEMORY: 134217728

targets:
  - name: spring-kafka
    profile: spring-kafka

  - name: spring-kafka-thread-pool.partitions-pollers-and-workers
    profile: spring-kafka-thread-pool
    parallelism: [partitions, pollers, workers]

  - name: spring-kafka-thread-pool.partitions-and-workers
    profile: spring-kafka-thread-pool
    parallelism: [partitions, workers]

  - name: spring-kafka-thread-pool
    profile: spring-kafka-thread-pool

  - name: spring-kafka-virtual-thread-pool
    profile: spring-kafka-virtual-thread-pool

  - name: spring-kafka-coroutines-naive.fixed.1
    profile: spring-kafka-coroutines-naive
    order_queue_capacity: 4096
    batch_queue_capacity: 4096
    telemetry_processing_mode: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 1
