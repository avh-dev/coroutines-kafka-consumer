services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.3
    container_name: ckc-perf-redpanda
    profiles:
      - redpanda
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=3G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://${LAB_NODE_IP}:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "0.0.0.0:9092:9092"
      - "0.0.0.0:9644:9644"
    networks:
      default:
        aliases:
          - kafka
          - apache-kafka-1
          - apache-kafka-2
          - apache-kafka-3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  apache-kafka:
    image: apache/kafka:4.3.1
    container_name: ckc-perf-kafka
    profiles:
      - apache-kafka
    restart: unless-stopped
    cpus: "${LAB_KAFKA_CPU_PER_BROKER:-2.0}"
    mem_limit: "${LAB_KAFKA_MEMORY_RUNTIME:-4g}"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@apache-kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${LAB_NODE_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,streams,share
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-1}"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_MIN_INSYNC_REPLICAS: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-1}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-1}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-1}"
      KAFKA_LOG_RETENTION_MS: "300000"
      KAFKA_LOG_SEGMENT_MS: "60000"
      KAFKA_HEAP_OPTS: "-Xms${LAB_KAFKA_HEAP_RUNTIME:-2g} -Xmx${LAB_KAFKA_HEAP_RUNTIME:-2g}"
      KAFKA_OPTS: "-javaagent:/opt/thread-stats/thread-stats-agent.jar=config=/opt/thread-stats/kafka-agent.properties"
    ports:
      - "0.0.0.0:9092:9092"
      - "0.0.0.0:9414:9404"
    volumes:
      - ${LAB_ROOT}/thread-stats/thread-stats-agent.jar:/opt/thread-stats/thread-stats-agent.jar:ro
      - ${LAB_ROOT}/docker/compose/thread-stats-kafka-agent.properties:/opt/thread-stats/kafka-agent.properties:ro
    networks:
      default:
        aliases:
          - kafka
          - apache-kafka-1
          - apache-kafka-2
          - apache-kafka-3
    deploy:
      resources:
        limits:
          cpus: "${LAB_KAFKA_CPU_PER_BROKER:-2.0}"
          memory: "${LAB_KAFKA_MEMORY_RUNTIME:-4g}"
    healthcheck:
      test: ["CMD-SHELL", "env KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  apache-kafka-1:
    image: apache/kafka:4.3.1
    container_name: ckc-perf-kafka-1
    hostname: apache-kafka-1
    profiles:
      - apache-kafka-cluster
    restart: unless-stopped
    cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
    mem_limit: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    environment: &apache-kafka-cluster-environment
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@apache-kafka-1:29093,2@apache-kafka-2:29093,3@apache-kafka-3:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,streams,share
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-3}"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-3}"
      KAFKA_MIN_INSYNC_REPLICAS: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${LAB_KAFKA_REPLICATION_FACTOR:-3}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${LAB_KAFKA_MIN_INSYNC_REPLICAS:-2}"
      KAFKA_LOG_RETENTION_MS: "300000"
      KAFKA_LOG_SEGMENT_MS: "60000"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms${LAB_KAFKA_HEAP_RUNTIME:-1g} -Xmx${LAB_KAFKA_HEAP_RUNTIME:-1g}"
      KAFKA_OPTS: "-javaagent:/opt/thread-stats/thread-stats-agent.jar=config=/opt/thread-stats/kafka-agent.properties"
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://apache-kafka-1:29092,EXTERNAL://${LAB_NODE_IP}:9092
    ports:
      - "0.0.0.0:9092:9092"
      - "0.0.0.0:9414:9404"
    volumes:
      - apache-kafka-1-data:/var/lib/kafka/data
      - ${LAB_ROOT}/thread-stats/thread-stats-agent.jar:/opt/thread-stats/thread-stats-agent.jar:ro
      - ${LAB_ROOT}/docker/compose/thread-stats-kafka-agent.properties:/opt/thread-stats/kafka-agent.properties:ro
    networks:
      default:
        aliases:
          - kafka
    deploy:
      resources:
        limits:
          cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
          memory: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    healthcheck: &apache-kafka-cluster-healthcheck
      test: ["CMD-SHELL", "env KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 24

  apache-kafka-2:
    image: apache/kafka:4.3.1
    container_name: ckc-perf-kafka-2
    hostname: apache-kafka-2
    profiles:
      - apache-kafka-cluster
    restart: unless-stopped
    cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
    mem_limit: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    environment:
      <<: *apache-kafka-cluster-environment
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://apache-kafka-2:29092,EXTERNAL://${LAB_NODE_IP}:9093
    ports:
      - "0.0.0.0:9093:9092"
      - "0.0.0.0:9415:9404"
    volumes:
      - apache-kafka-2-data:/var/lib/kafka/data
      - ${LAB_ROOT}/thread-stats/thread-stats-agent.jar:/opt/thread-stats/thread-stats-agent.jar:ro
      - ${LAB_ROOT}/docker/compose/thread-stats-kafka-agent.properties:/opt/thread-stats/kafka-agent.properties:ro
    deploy:
      resources:
        limits:
          cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
          memory: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    healthcheck: *apache-kafka-cluster-healthcheck

  apache-kafka-3:
    image: apache/kafka:4.3.1
    container_name: ckc-perf-kafka-3
    hostname: apache-kafka-3
    profiles:
      - apache-kafka-cluster
    restart: unless-stopped
    cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
    mem_limit: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    environment:
      <<: *apache-kafka-cluster-environment
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://apache-kafka-3:29092,EXTERNAL://${LAB_NODE_IP}:9094
    ports:
      - "0.0.0.0:9094:9092"
      - "0.0.0.0:9416:9404"
    volumes:
      - apache-kafka-3-data:/var/lib/kafka/data
      - ${LAB_ROOT}/thread-stats/thread-stats-agent.jar:/opt/thread-stats/thread-stats-agent.jar:ro
      - ${LAB_ROOT}/docker/compose/thread-stats-kafka-agent.properties:/opt/thread-stats/kafka-agent.properties:ro
    deploy:
      resources:
        limits:
          cpus: "${LAB_KAFKA_CPU_PER_BROKER:-1.0}"
          memory: "${LAB_KAFKA_MEMORY_RUNTIME:-2g}"
    healthcheck: *apache-kafka-cluster-healthcheck

  redis:
    image: redis:7.4-alpine
    container_name: ckc-perf-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    container_name: ckc-internal-fluent-bit
    restart: unless-stopped
    ports:
      - "0.0.0.0:5170:5170"
      - "127.0.0.1:2020:2020"
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ${LAB_ROOT}/docker/compose/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ${LAB_ROOT}/results/live/audit:/audit
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  loki:
    image: grafana/loki:3.3.2
    container_name: ckc-internal-loki
    restart: unless-stopped
    user: "0:0"
    ports:
      - "0.0.0.0:3100:3100"
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ${LAB_ROOT}/docker/compose/loki.yaml:/etc/loki/loki.yaml:ro
      - ${LAB_ROOT}/loki:/loki
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ckc-internal-grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_DOMAIN: "${LAB_HOST:-localhost}"
      GF_SERVER_ROOT_URL: "http://${LAB_HOST:-localhost}:3000/"
    volumes:
      - ${LAB_ROOT}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${LAB_ROOT}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: ckc-internal-kafka-exporter
    restart: unless-stopped
    ports:
      - "0.0.0.0:9308:9308"
    command:
      - --kafka.server=kafka:29092
      - --kafka.server=apache-kafka-2:29092
      - --kafka.server=apache-kafka-3:29092
      - --web.listen-address=:9308
      - --topic.filter=^(order|batch|cauldron)\.events\.v1$
      - --group.filter=^ckc-demo$
      - --offset.show-all

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: ckc-internal-process-exporter
    restart: unless-stopped
    ports:
      - "0.0.0.0:9256:9256"
    command:
      - --procfs=/host/proc
      - --config.path=/config/process-exporter.yml
    volumes:
      - /proc:/host/proc:ro
      - ${LAB_ROOT}/docker/compose/process-exporter.yml:/config/process-exporter.yml:ro

volumes:
  apache-kafka-1-data:
  apache-kafka-2-data:
  apache-kafka-3-data:
