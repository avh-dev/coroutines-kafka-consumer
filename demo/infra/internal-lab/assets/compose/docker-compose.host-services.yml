services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.3
    container_name: ckc-perf-redpanda
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 4g
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=3G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://${LAB_NODE_IP}:9092
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "0.0.0.0:9092:9092"
      - "0.0.0.0:9644:9644"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  redis:
    image: redis:7.4-alpine
    container_name: ckc-perf-redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    container_name: ckc-internal-fluent-bit
    restart: unless-stopped
    ports:
      - "0.0.0.0:5170:5170"
      - "127.0.0.1:2020:2020"
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./audit/live:/audit
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ckc-internal-grafana
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_DOMAIN: "${LAB_HOST:-localhost}"
      GF_SERVER_ROOT_URL: "http://${LAB_HOST:-localhost}:3000/"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./workspace/demo/infra/shared/grafana/dashboards:/var/lib/grafana/dashboards:ro

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: ckc-internal-kafka-exporter
    restart: unless-stopped
    ports:
      - "0.0.0.0:9308:9308"
    command:
      - --kafka.server=kafka:29092
      - --web.listen-address=:9308
      - --topic.filter=^(order|batch|cauldron)\.events\.v1$
      - --group.filter=^(potion-tracking|spring-kafka)-.*$
      - --offset.show-all
    depends_on:
      kafka:
        condition: service_healthy

  process-exporter:
    image: ncabatoff/process-exporter:0.8.7
    container_name: ckc-internal-process-exporter
    restart: unless-stopped
    ports:
      - "0.0.0.0:9256:9256"
    command:
      - --procfs=/host/proc
      - --config.path=/config/process-exporter.yml
    volumes:
      - /proc:/host/proc:ro
      - ./process-exporter.yml:/config/process-exporter.yml:ro
