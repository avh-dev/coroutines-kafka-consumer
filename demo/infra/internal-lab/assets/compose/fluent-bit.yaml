service:
  flush: 1
  daemon: off
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on

pipeline:
  inputs:
    - name: tcp
      listen: 0.0.0.0
      port: 5170
      chunk_size: 256
      buffer_size: 1024
      format: none
      separator: LF

  outputs:
    - name: file
      match: '*'
      path: /var/log/ckc-audit
      file: audit.log
      format: template
      template: '{log}\n'
      mkdir: on
