apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckc-warmup-kafka-state
  namespace: ckc-perf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ckc-warmup-kafka-state
  namespace: ckc-perf
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ckc-warmup-kafka-state
  namespace: ckc-perf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ckc-warmup-kafka-state
subjects:
  - kind: ServiceAccount
    name: ckc-warmup-kafka-state
    namespace: ckc-perf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckc-warmup-kafka-state
  namespace: ckc-perf
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-warmup-kafka-state
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-warmup-kafka-state
    spec:
      serviceAccountName: ckc-warmup-kafka-state
      nodeSelector:
        ckc.dev/role: controller
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args:
            - --namespaces=ckc-perf
            - --resources=pods
            - --metric-labels-allowlist=pods=[ckc_run_id]
            - --metric-allowlist=kube_pod_labels,kube_pod_created,kube_pod_container_resource_requests,kube_pod_container_resource_limits,kube_pod_status_ready,kube_pod_container_status_running,kube_pod_container_status_restarts_total
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-warmup-kafka-state
  namespace: ckc-perf
spec:
  selector:
    app.kubernetes.io/name: ckc-warmup-kafka-state
  ports:
    - name: metrics
      port: 8080
