apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckc-prometheus
  namespace: ckc-perf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ckc-perf-prometheus-discovery
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ckc-perf-prometheus-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckc-perf-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: ckc-prometheus
    namespace: ckc-perf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ckc-prometheus-config
  namespace: ckc-perf
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: ckc-demo
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ckc-perf
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: ckc-demo
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: kubernetes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: ckc-kafka-exporter
        metrics_path: /metrics
        static_configs:
          - targets:
              - ckc-external-kafka-exporter.ckc-perf.svc.cluster.local:9308

      - job_name: ckc-redpanda-public-metrics
        metrics_path: /public_metrics
        static_configs:
          - targets:
              - ckc-external-redpanda-admin.ckc-perf.svc.cluster.local:9644

      - job_name: ckc-host-process-exporter
        metrics_path: /metrics
        static_configs:
          - targets:
              - ckc-external-process-exporter.ckc-perf.svc.cluster.local:9256
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckc-prometheus
  namespace: ckc-perf
  labels:
    app.kubernetes.io/name: ckc-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ckc-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckc-prometheus
    spec:
      serviceAccountName: ckc-prometheus
      initContainers:
        - name: prometheus-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 65534:65534 /prometheus
          volumeMounts:
            - name: data
              mountPath: /prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.3.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=1GB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: ckc-prometheus-config
        - name: data
          hostPath:
            path: /opt/ckc-internal-lab/prometheus
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ckc-prometheus
  namespace: ckc-perf
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ckc-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
