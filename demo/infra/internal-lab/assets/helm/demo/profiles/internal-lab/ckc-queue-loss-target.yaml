replicaCount: 2

lab:
  kafkaTopics:
    - name: order.events.v1
      partitions: 2
    - name: batch.events.v1
      partitions: 2
    - name: cauldron.events.v1
      partitions: 2

env:
  springProfilesActive: ckc
  javaToolOptions: "-Xms512m -Xmx1024m -XX:+UseSerialGC"
  orderWorkerConcurrency: 2
  orderPollLoopConcurrency: 1
  orderWorkChannelCapacity: 2000
  orderProcessingMode: AT_LEAST_ONCE_UNORDERED
  batchWorkerConcurrency: 2
  batchPollLoopConcurrency: 1
  batchWorkChannelCapacity: 2000
  batchProcessingMode: AT_LEAST_ONCE_UNORDERED
  telemetryWorkerConcurrency: 4
  telemetryPollLoopConcurrency: 1
  telemetryWorkChannelCapacity: 512

resources:
  requests:
    cpu: "1"
    memory: 1Gi

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 8
  startup:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 30

hpa:
  enabled: false
