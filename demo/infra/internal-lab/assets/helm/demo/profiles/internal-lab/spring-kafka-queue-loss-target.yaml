replicaCount: 2

lab:
  kafkaTopics:
    - name: order.events.v1
      partitions: 2
    - name: batch.events.v1
      partitions: 2
    - name: cauldron.events.v1
      partitions: 2

env:
  springProfilesActive: spring-kafka
  javaToolOptions: "-Xms512m -Xmx1024m -XX:+UseSerialGC"
  orderProcessingMode: AT_LEAST_ONCE_PARTITION_ORDERING
  orderPollLoopConcurrency: 1
  batchProcessingMode: AT_LEAST_ONCE_PARTITION_ORDERING
  batchPollLoopConcurrency: 1
  telemetryPollLoopConcurrency: 1

resources:
  requests:
    cpu: "1"
    memory: 1Gi

probes:
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 8
  startup:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 30

hpa:
  enabled: false
