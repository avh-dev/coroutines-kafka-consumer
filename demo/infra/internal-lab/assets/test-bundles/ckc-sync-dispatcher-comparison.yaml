name: ckc-sync-dispatcher-comparison
description: Compare suspend CKC, CKC sync Dispatchers.IO, and CKC sync virtual-thread dispatcher mode on the same baseline test.

defaults:
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: true
    METRICS_IMPLEMENTATION: MICROMETER

tests:
  - name: ckc
    profile: ckc
    test_definition: 45min
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2

  - name: ckc-sync
    profile: ckc-sync
    test_definition: 45min

  - name: ckc-sync-virtual
    profile: ckc-sync
    test_definition: 45min
    env:
      PROCESSING_DISPATCHER_TYPE: VIRTUAL
