name: smoke-repeat
description: Run the short smoke definition twice to validate bundle orchestration.

defaults:
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: true
    METRICS_IMPLEMENTATION: MICROMETER
    LOAD_TEST_WORKERS: 1

tests:
  - name: ckc-smoke-1
    profile: ckc
    base_rate: 100
    test_definition: smoke
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2

  - name: ckc-smoke-2
    profile: ckc
    base_rate: 100
    test_definition: smoke
    env:
      PROCESSING_DISPATCHER_TYPE: FIXED
      WORKER_DISPATCHER_THREADS: 2
