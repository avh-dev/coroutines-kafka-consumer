global:
  defaultCapacityFactor: 1.2
  overheadMs: 3.0
  minPartitions: 1
  noopProcessingLatencyMs: 6.5

topics:
  order:
    kafkaTopic: order.events.v1
    percentKey: order_event_percent
    envPrefix: order
    latencySources: [eta, flavour]
  batch:
    kafkaTopic: batch.events.v1
    percentKey: batch_event_percent
    envPrefix: batch
    latencySources: [registry]
  telemetry:
    kafkaTopic: cauldron.events.v1
    percentKey: cauldron_telemetry_percent
    envPrefix: telemetry
    latencySources: []

profiles:
  ckc:
    springProfilesActive: ckc
    replicaCount: 2
    parallelism:
      primary: workers
      adjustable: [partitions, workers, pollers]
    defaultCapacityFactor: 1.2
    defaultPartitions: 2
    defaultProcessingDispatcher: FIXED
    allowedProcessingDispatchers: [DEFAULT, FIXED, IO, VIRTUAL]
    defaultProcessingModes:
      order: AT_LEAST_ONCE_KEY_ORDERING
      batch: AT_LEAST_ONCE_KEY_ORDERING
      telemetry: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      batch: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      telemetry: [FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY, FRESHNESS_FIRST_DROP_OLDEST, AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
    env:
      processingDispatcherType: AUTO
      orderPollLoopConcurrency: 1
      orderWorkChannelCapacity: 1024
      batchPollLoopConcurrency: 1
      batchWorkChannelCapacity: 1024
      telemetryPollLoopConcurrency: 1
      telemetryWorkChannelCapacity: 10000
    resources:
      requests:
        cpu: "1"
        memory: 1Gi

  ckc-spring-boot:
    extends: ckc
    springProfilesActive: ckc-spring-boot
    defaultProcessingModes:
      order: AT_LEAST_ONCE_KEY_ORDERING
      batch: AT_LEAST_ONCE_KEY_ORDERING
      telemetry: FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY

  ckc-sync:
    extends: ckc
    springProfilesActive: ckc-sync
    defaultProcessingDispatcher: IO
    allowedProcessingDispatchers: [IO, VIRTUAL]

  confluent-sync:
    extends: ckc
    springProfilesActive: confluent-parallel
    defaultProcessingDispatcher: ""
    allowedProcessingDispatchers: []
    defaultProcessingModes:
      order: AT_LEAST_ONCE_KEY_ORDERING
      batch: AT_LEAST_ONCE_KEY_ORDERING
      telemetry: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      batch: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      telemetry: [HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED, AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]

  confluent-reactor:
    extends: ckc
    springProfilesActive: confluent-parallel-reactor
    defaultProcessingModes:
      order: AT_LEAST_ONCE_KEY_ORDERING
      batch: AT_LEAST_ONCE_KEY_ORDERING
      telemetry: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      batch: [AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]
      telemetry: [HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED, AT_LEAST_ONCE_KEY_ORDERING, AT_LEAST_ONCE_PARTITION_ORDERING, AT_LEAST_ONCE_NO_ORDERING]

  spring-kafka-coroutines-naive:
    extends: ckc
    springProfilesActive: spring-kafka-coroutines-naive
    defaultProcessingModes:
      order: AT_LEAST_ONCE_NO_ORDERING
      batch: AT_LEAST_ONCE_NO_ORDERING
      telemetry: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_NO_ORDERING]
      batch: [AT_LEAST_ONCE_NO_ORDERING]
      telemetry: [HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED]

  spring-kafka:
    springProfilesActive: spring-kafka
    replicaCount: 2
    parallelism:
      primary: partitions
      adjustable: [partitions, pollers]
    defaultCapacityFactor: 1.2
    defaultProcessingModes:
      order: AT_LEAST_ONCE_PARTITION_ORDERING
      batch: AT_LEAST_ONCE_PARTITION_ORDERING
      telemetry: HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_PARTITION_ORDERING]
      batch: [AT_LEAST_ONCE_PARTITION_ORDERING]
      telemetry: [HARDCODED_FRESHNESS_FIRST_DROP_EXPIRED]
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
