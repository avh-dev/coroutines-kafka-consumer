global:
  defaultCapacityFactor: 1.2
  overheadMs: 3.0
  minPartitions: 1
  noopProcessingLatencyMs: 6.5

topics:
  order:
    kafkaTopic: order.events.v1
    percentKey: order_event_percent
    envPrefix: order
    latencySources: [eta, flavour]
  batch:
    kafkaTopic: batch.events.v1
    percentKey: batch_event_percent
    envPrefix: batch
    latencySources: [registry]
  telemetry:
    kafkaTopic: cauldron.events.v1
    percentKey: cauldron_telemetry_percent
    envPrefix: telemetry
    latencySources: []

profiles:
  ckc:
    springProfilesActive: ckc
    replicaCount: 2
    parallelism:
      primary: workers
      adjustable: [partitions, workers, pollers]
    defaultCapacityFactor: 1.2
    defaultPartitions: 2
    defaultProcessingModes:
      order: AT_LEAST_ONCE_ORDERED_BY_KEY
      batch: AT_LEAST_ONCE_ORDERED_BY_KEY
      telemetry: FRESHNESS_FIRST_BY_KEY
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_ORDERED_BY_KEY, AT_LEAST_ONCE_ORDERED_BY_PARTITION, AT_LEAST_ONCE_UNORDERED]
      batch: [AT_LEAST_ONCE_ORDERED_BY_KEY, AT_LEAST_ONCE_ORDERED_BY_PARTITION, AT_LEAST_ONCE_UNORDERED]
      telemetry: [FRESHNESS_FIRST_BY_KEY, FRESHNESS_FIRST, AT_LEAST_ONCE_ORDERED_BY_KEY, AT_LEAST_ONCE_UNORDERED]
    env:
      orderPollLoopConcurrency: 1
      orderWorkChannelCapacity: 1024
      batchPollLoopConcurrency: 1
      batchWorkChannelCapacity: 1024
      telemetryPollLoopConcurrency: 1
      telemetryWorkChannelCapacity: 10000
    resources:
      requests:
        cpu: "1"
        memory: 1Gi

  ckc-spring-boot:
    extends: ckc
    springProfilesActive: ckc-spring-boot
    defaultProcessingModes:
      order: AT_LEAST_ONCE_ORDERED_BY_KEY
      batch: AT_LEAST_ONCE_ORDERED_BY_KEY
      telemetry: FRESHNESS_FIRST_BY_KEY

  ckc-sync:
    extends: ckc
    springProfilesActive: ckc-sync

  ckc-sync-loom:
    extends: ckc
    springProfilesActive: ckc-sync-loom

  confluent-sync:
    extends: ckc
    springProfilesActive: confluent-parallel

  confluent-reactor:
    extends: ckc
    springProfilesActive: confluent-parallel-reactor

  spring-kafka-coroutines-naive:
    extends: ckc
    springProfilesActive: spring-kafka-coroutines-naive
    defaultProcessingModes:
      order: AT_LEAST_ONCE_UNORDERED
      batch: AT_LEAST_ONCE_UNORDERED
      telemetry: FRESHNESS_FIRST

  spring-kafka:
    springProfilesActive: spring-kafka
    replicaCount: 2
    parallelism:
      primary: partitions
      adjustable: [partitions, pollers]
    defaultCapacityFactor: 1.2
    defaultProcessingModes:
      order: AT_LEAST_ONCE_ORDERED_BY_PARTITION
      batch: AT_LEAST_ONCE_ORDERED_BY_PARTITION
      telemetry: FRESHNESS_FIRST
    allowedProcessingModes:
      order: [AT_LEAST_ONCE_ORDERED_BY_PARTITION]
      batch: [AT_LEAST_ONCE_ORDERED_BY_PARTITION]
      telemetry: [FRESHNESS_FIRST]
    resources:
      requests:
        cpu: "1"
        memory: 1Gi

presets:
  ordered-by-partition:
    processingModes:
      order: AT_LEAST_ONCE_ORDERED_BY_PARTITION
      batch: AT_LEAST_ONCE_ORDERED_BY_PARTITION

  queue-loss-target:
    processingModes:
      order: AT_LEAST_ONCE_UNORDERED
      batch: AT_LEAST_ONCE_UNORDERED
      telemetry: FRESHNESS_FIRST
    capacityFactor: 0.5

  telemetry-freshness-first:
    processingModes:
      telemetry: FRESHNESS_FIRST

  telemetry-freshness-first-by-key:
    processingModes:
      telemetry: FRESHNESS_FIRST_BY_KEY
