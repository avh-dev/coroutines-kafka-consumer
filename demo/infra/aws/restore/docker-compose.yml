services:
  loki:
    image: grafana/loki:3.3.2
    user: "0:0"
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:${CKC_AWS_RESTORE_LOKI_PORT:-3102}:3100"
    volumes:
      - ${CKC_AWS_RESTORE_RESULT_DIR}/restore/loki.yaml:/etc/loki/loki.yaml:ro
      - ${CKC_AWS_RESTORE_ROOT}/loki:/loki

  prometheus:
    image: victoriametrics/victoria-metrics:v1.102.1
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:9090
    volumes:
      - ${CKC_AWS_RESTORE_ROOT}/prometheus:/victoria-metrics-data

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "${CKC_AWS_RESTORE_GRAFANA_BIND_ADDRESS:-0.0.0.0}:${CKC_AWS_RESTORE_GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_VIEWERS_CAN_EDIT: "true"
    volumes:
      - ${CKC_AWS_RESTORE_ROOT}/grafana:/var/lib/grafana
      - ${CKC_AWS_GRAFANA_PROVISIONING_DIR}:/etc/grafana/provisioning:ro
      - ${CKC_AWS_RESTORE_RESULT_DIR}/config/ckc-experiment.json:/var/lib/grafana/dashboards/ckc-experiment.json:ro
    depends_on:
      - loki
      - prometheus
