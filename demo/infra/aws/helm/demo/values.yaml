replicaCount: 1

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  port: 8080
  type: ClusterIP
  nodePort: null

env:
  springProfilesActive: ckc
  kafkaEnabled: true
  demoKafkaEnabled: true
  bootstrapServers: ""
  redisHost: ""
  redisPort: 6379
  auditTcpHost: ""
  auditTcpPort: 5170
  auditRunId: local
  javaToolOptions: ""
  modelBaseUrl: ""
  etaModelBaseUrl: ""
  flavourModelBaseUrl: ""
  registryBaseUrl: ""
  processingEnabled: true
  metricsImplementation: MICROMETER
  workerDispatcherThreads: 8
  freshnessFirstMaxRecordAgeSeconds: 10
  consumerRetryMaxAttempts: 3
  consumerRetryBackoffMs: 250
  kafkaConsumerFetchMinBytes: 8192
  kafkaConsumerFetchMaxWaitMs: 250
  kafkaConsumerMaxPollRecords: 500
  auditLogEnabled: true
  orderProcessingMode: AT_LEAST_ONCE_KEY_ORDERING
  orderWorkerConcurrency: 2
  orderPollLoopConcurrency: 1
  orderWorkChannelCapacity: 1024
  batchProcessingMode: AT_LEAST_ONCE_KEY_ORDERING
  batchWorkerConcurrency: 2
  batchPollLoopConcurrency: 1
  batchWorkChannelCapacity: 1024
  telemetryProcessingMode: FRESHNESS_FIRST_DROP_OLDEST
  telemetryWorkerConcurrency: 4
  telemetryPollLoopConcurrency: 1
  telemetryWorkChannelCapacity: 256

resources: {}

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 1
    failureThreshold: 3
  startup:
    enabled: false
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 30

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

hostAliases: []
