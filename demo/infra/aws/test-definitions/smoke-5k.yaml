name: smoke-5k

deployment:
  app_profile: ckc-hpa
  kafka_topics:
    - name: order.events.v1
      partitions: 12
    - name: batch.events.v1
      partitions: 12
    - name: cauldron.events.v1
      partitions: 12

load_test:
  shards: 2
  base_tps: 5000
  order_event_percent: 35
  batch_event_percent: 25
  cauldron_telemetry_percent: 40
  load_profile: "0 -> (60s, warmup) -> 100 -> (480s, steady) -> 100 -> (60s, cool-down) -> 0"
  cauldron_count: 32
  min_orders_per_batch: 3
  max_orders_per_batch: 6
  min_brewing_steps: 5
  max_brewing_steps: 8
  diagnostics_blob_size: 256
  stats_log_interval_seconds: 15
