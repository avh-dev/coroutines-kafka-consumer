name: aws-smoke
description: Minimal end-to-end AWS experiment using the shared experiment and target contracts.
lab:
  profile: default
test:
  extends: smoke

defaults:
  replicas: 1
  env:
    PROCESSING_ENABLED: true
    AUDIT_LOG_ENABLED: true
    METRICS_IMPLEMENTATION: MICROMETER

targets:
  - name: ckc
    profile: ckc
    planning_latency:
      order_ms: 50
      batch_ms: 50
      telemetry_ms: 150
