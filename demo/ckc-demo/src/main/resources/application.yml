spring:
  main:
    web-application-type: none
  profiles:
    default: ckc
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    org.springframework.context.support: TRACE
#    org.springframework.kafka.listener: DEBUG
#    org.springframework.kafka.config: DEBUG

ckc:
  enabled: false

thread-stats:
  enabled: ${THREAD_STATS_ENABLED:true}
  sampling-interval: ${THREAD_STATS_SAMPLING_INTERVAL:1s}
  fallback-category: other
  fallback-group: other
  metrics:
    enabled: ${THREAD_STATS_METRICS_ENABLED:true}
  categories:
    - name: business
      groups:
        - name: ckc-worker
          rules:
            - { type: prefix, value: ckc-worker- }
            - { type: prefix, value: ckc-sync-worker- }
            - { type: prefix, value: ckc-spring-boot-worker- }
        - name: demo-virtual-worker
          rules:
            - { type: prefix, value: demo-processing-virtual- }
        - name: virtual-thread-runtime
          rules:
            - { type: prefix, value: ForkJoinPool- }
            - { type: exact, value: VirtualThread-unparker }
        - name: spring-kafka-worker
          rules:
            - { type: prefix, value: spring-kafka-coroutines-naive-worker- }
        - name: spring-kafka-thread-pool-worker
          rules:
            - { type: prefix, value: spring-kafka-thread-pool- }
        - name: spring-kafka-virtual-worker
          rules:
            - { type: prefix, value: spring-kafka-virtual-thread-pool- }
        - name: confluent-parallel
          rules:
            - { type: prefix, value: confluent-parallel- }
        - name: confluent-parallel-worker
          rules:
            - { type: prefix, value: pc-reactor-worker- }
    - name: kafka
      groups:
        - name: ckc-poll
          rules:
            - { type: prefix, value: kafka-poll- }
        - name: spring-kafka-consumer
          rules:
            - { type: prefix, value: spring-kafka-consumer-order-lifecycle- }
            - { type: prefix, value: spring-kafka-consumer-batch-lifecycle- }
            - { type: prefix, value: spring-kafka-consumer-cauldron-telemetry- }
        - name: kafka-client
          rules:
            - { type: prefix, value: pc-broker-poll }
            - { type: prefix, value: pc-control }
            - { type: prefix, value: pc-pool- }
            - { type: prefix, value: micrometer-kafka-metrics }
            - { type: prefix, value: kafka- }
    - name: http-client
      groups:
        - name: armeria-client
          rules:
            - { type: prefix, value: armeria-common-worker- }
        - name: jdk-http-client
          rules:
            - { type: prefix, value: HttpClient- }
    - name: redis-client
      groups:
        - name: redis-client
          rules:
            - { type: prefix, value: lettuce- }
    - name: audit
      groups:
        - name: audit
          rules:
            - { type: prefix, value: logback-appender-AUDIT_TCP- }
    - name: other
      groups:
        - name: main
          rules:
            - { type: exact, value: main }
        - name: thread-stats
          rules:
            - { type: prefix, value: thread-stats- }
        - name: jvm-fork-join
          rules:
            - { type: prefix, value: ForkJoinPool.commonPool- }
        - name: spring-task-scheduler
          rules:
            - { type: prefix, value: ThreadPoolTaskScheduler- }
        - name: armeria-server
          rules:
            - { type: prefix, value: armeria-boss- }
            - { type: prefix, value: armeria-eventloop- }
            - { type: prefix, value: armeria-blocking-tasks- }
        - name: armeria-other
          rules:
            - { type: prefix, value: armeria- }
        - name: spring-lifecycle
          rules:
            - { type: prefix, value: startstop-support- }
        - name: coroutine-runtime
          rules:
            - { type: prefix, value: DefaultDispatcher- }
        - name: jvm-system
          rules:
            - { type: exact, value: Reference Handler }
            - { type: exact, value: Finalizer }
            - { type: exact, value: Signal Dispatcher }
            - { type: exact, value: Notification Thread }
            - { type: exact, value: Common-Cleaner }
            - { type: exact, value: DestroyJavaVM }

armeria:
  graceful-shutdown-quiet-period-millis: 1000
  graceful-shutdown-timeout-millis: 3000
  worker-group: ${ARMERIA_WORKER_THREADS:1}
  blocking-task-executor: ${ARMERIA_BLOCKING_THREADS:1}
  ports:
    - port: ${SERVER_PORT:8080}
      protocols:
        - HTTP
  internal-services:
    include: actuator
    port: ${SERVER_PORT:8080}

demo:
  experiment-target-name: ${EXPERIMENT_TARGET_NAME:}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: localhost:9092
    group-id: ${GROUP_ID:ckc-demo}
    consumer:
      fetch-min-bytes: ${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}
      fetch-max-wait-ms: ${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:500}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      fetch-max-bytes: ${KAFKA_CONSUMER_FETCH_MAX_BYTES:52428800}
      max-partition-fetch-bytes: ${KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:1048576}
      commit-interval-ms: ${KAFKA_CONSUMER_COMMIT_INTERVAL_MS:5000}
  topics:
    order-events: order.events.v1
    batch-events: batch.events.v1
    cauldron-events: cauldron.events.v1
  model:
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:18080}
    eta-base-url: ${ETA_MODEL_BASE_URL:${MODEL_BASE_URL:http://127.0.0.1:18080}}
    flavour-base-url: ${FLAVOUR_MODEL_BASE_URL:${MODEL_BASE_URL:http://127.0.0.1:18080}}
    http-client: ${MODEL_HTTP_CLIENT:ARMERIA}
    sync-http-client: ${MODEL_SYNC_HTTP_CLIENT:ARMERIA}
    jdk-http-client-executor: ${JDK_HTTP_CLIENT_EXECUTOR:DEFAULT}
    jdk-http-client-virtual-thread-name-prefix: ${JDK_HTTP_CLIENT_VIRTUAL_THREAD_NAME_PREFIX:HttpClient-virtual-}
  registry:
    base-url: ${REGISTRY_BASE_URL:http://127.0.0.1:18080}
  redis:
    metrics:
      enabled: ${LETTUCE_METRICS_ENABLED:true}
  audit:
    enabled: ${AUDIT_LOG_ENABLED:true}
    host: ${AUDIT_TCP_HOST:127.0.0.1}
    port: ${AUDIT_TCP_PORT:5170}
    run-id: ${AUDIT_RUN_ID:local}
    writer-id: ${AUDIT_WRITER_ID:${HOSTNAME:demo}}
  consumers:
    processing-enabled: ${DEMO_CONSUMER_PROCESSING_ENABLED:true}
    metrics-implementation: ${METRICS_IMPLEMENTATION:MICROMETER}
    processing-dispatcher-type: ${PROCESSING_DISPATCHER_TYPE:AUTO}
    worker-dispatcher-threads: ${WORKER_DISPATCHER_THREADS:8}
    virtual-thread-name-prefix: ${PROCESSING_DISPATCHER_VIRTUAL_THREAD_NAME_PREFIX:demo-processing-virtual-}
    freshness-first-max-record-age-seconds: ${FRESHNESS_FIRST_MAX_RECORD_AGE_SECONDS:10}
    retry:
      max-attempts: ${DEMO_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${DEMO_CONSUMER_RETRY_BACKOFF_MS:250}
    order:
      processing-mode: ${ORDER_PROCESSING_MODE:AT_LEAST_ONCE_NO_ORDERING}
      worker-concurrency: ${ORDER_WORKER_CONCURRENCY:2}
      poll-loop-concurrency: ${ORDER_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${ORDER_WORK_CHANNEL_CAPACITY:1024}
      kafka:
        fetch-min-bytes: ${ORDER_KAFKA_CONSUMER_FETCH_MIN_BYTES:${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}}
        fetch-max-wait-ms: ${ORDER_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:500}}
        max-poll-records: ${ORDER_KAFKA_CONSUMER_MAX_POLL_RECORDS:${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}}
        fetch-max-bytes: ${ORDER_KAFKA_CONSUMER_FETCH_MAX_BYTES:${KAFKA_CONSUMER_FETCH_MAX_BYTES:52428800}}
        max-partition-fetch-bytes: ${ORDER_KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:${KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:1048576}}
    batch:
      processing-mode: ${BATCH_PROCESSING_MODE:AT_LEAST_ONCE_NO_ORDERING}
      worker-concurrency: ${BATCH_WORKER_CONCURRENCY:2}
      poll-loop-concurrency: ${BATCH_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${BATCH_WORK_CHANNEL_CAPACITY:1024}
      kafka:
        fetch-min-bytes: ${BATCH_KAFKA_CONSUMER_FETCH_MIN_BYTES:${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}}
        fetch-max-wait-ms: ${BATCH_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:500}}
        max-poll-records: ${BATCH_KAFKA_CONSUMER_MAX_POLL_RECORDS:${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}}
        fetch-max-bytes: ${BATCH_KAFKA_CONSUMER_FETCH_MAX_BYTES:${KAFKA_CONSUMER_FETCH_MAX_BYTES:52428800}}
        max-partition-fetch-bytes: ${BATCH_KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:${KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:1048576}}
    telemetry:
      processing-mode: ${TELEMETRY_PROCESSING_MODE:FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY}
      worker-concurrency: ${TELEMETRY_WORKER_CONCURRENCY:4}
      poll-loop-concurrency: ${TELEMETRY_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${TELEMETRY_WORK_CHANNEL_CAPACITY:256}
      kafka:
        fetch-min-bytes: ${TELEMETRY_KAFKA_CONSUMER_FETCH_MIN_BYTES:${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}}
        fetch-max-wait-ms: ${TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:500}}
        max-poll-records: ${TELEMETRY_KAFKA_CONSUMER_MAX_POLL_RECORDS:${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}}
        fetch-max-bytes: ${TELEMETRY_KAFKA_CONSUMER_FETCH_MAX_BYTES:${KAFKA_CONSUMER_FETCH_MAX_BYTES:52428800}}
        max-partition-fetch-bytes: ${TELEMETRY_KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:${KAFKA_CONSUMER_MAX_PARTITION_FETCH_BYTES:1048576}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,threadstats
  metrics:
    distribution:
      percentiles-histogram:
        ckc.demo.model.call.duration: true
        ckc.demo.cauldron.telemetry.event.gap: true
        lettuce.command.completion: true
        demo.ckc.record.process.duration: true
        demo.ckc.record.end.to.end.duration: true
