spring:
  profiles:
    default: ckc
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false

demo:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: localhost:9092
    lifecycle-group-id: potion-tracking-lifecycle
    telemetry-group-id: potion-tracking-telemetry
  topics:
    order-lifecycle: potion.orders.lifecycle.v1
    cauldron-telemetry: potion.cauldrons.telemetry.v1
  model:
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:18080}
  audit:
    enabled: ${AUDIT_LOG_ENABLED:true}
  consumers:
    processing-enabled: ${DEMO_CONSUMER_PROCESSING_ENABLED:true}
    deserialization-dispatcher:
      mode: ${DEMO_CONSUMER_DESERIALIZATION_DISPATCHER:DEFAULT}
      custom-thread-pool-size: ${DEMO_CONSUMER_DESERIALIZATION_THREADS:8}
      custom-thread-name-prefix: ${DEMO_CONSUMER_DESERIALIZATION_THREAD_PREFIX:ckc-demo-deserializer}
    lifecycle:
      worker-concurrency: ${LIFECYCLE_WORKER_CONCURRENCY:2}
      poll-loop-concurrency: ${LIFECYCLE_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${LIFECYCLE_WORK_CHANNEL_CAPACITY:1024}
    telemetry:
      worker-concurrency: ${TELEMETRY_WORKER_CONCURRENCY:4}
      poll-loop-concurrency: ${TELEMETRY_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${TELEMETRY_WORK_CHANNEL_CAPACITY:256}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        ckc.record.process.duration: true
        pc.user.function.processing.time: true
