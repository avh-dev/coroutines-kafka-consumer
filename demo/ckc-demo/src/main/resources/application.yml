spring:
  main:
    web-application-type: none
  profiles:
    default: ckc
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    listener:
      auto-startup: false

logging:
  level:
    org.springframework.context.support: TRACE
#    org.springframework.kafka.listener: DEBUG
#    org.springframework.kafka.config: DEBUG

ckc:
  enabled: false

armeria:
  graceful-shutdown-quiet-period-millis: 1000
  graceful-shutdown-timeout-millis: 3000
  worker-group: ${ARMERIA_WORKER_THREADS:1}
  blocking-task-executor: ${ARMERIA_BLOCKING_THREADS:1}
  ports:
    - port: ${SERVER_PORT:8080}
      protocols:
        - HTTP
  internal-services:
    include: actuator
    port: ${SERVER_PORT:8080}

demo:
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: localhost:9092
    order-group-id: potion-tracking-orders
    batch-group-id: potion-tracking-batches
    cauldron-group-id: potion-tracking-cauldrons
    consumer:
      fetch-min-bytes: ${KAFKA_CONSUMER_FETCH_MIN_BYTES:1}
      fetch-max-wait-ms: ${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:500}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:500}
      commit-interval-ms: ${KAFKA_CONSUMER_COMMIT_INTERVAL_MS:5000}
  topics:
    order-events: order.events.v1
    batch-events: batch.events.v1
    cauldron-events: cauldron.events.v1
  model:
    base-url: ${MODEL_BASE_URL:http://127.0.0.1:18080}
    eta-base-url: ${ETA_MODEL_BASE_URL:${MODEL_BASE_URL:http://127.0.0.1:18080}}
    flavour-base-url: ${FLAVOUR_MODEL_BASE_URL:${MODEL_BASE_URL:http://127.0.0.1:18080}}
  registry:
    base-url: ${REGISTRY_BASE_URL:http://127.0.0.1:18080}
  redis:
    metrics:
      enabled: ${LETTUCE_METRICS_ENABLED:true}
  audit:
    enabled: ${AUDIT_LOG_ENABLED:true}
    host: ${AUDIT_TCP_HOST:127.0.0.1}
    port: ${AUDIT_TCP_PORT:5170}
    run-id: ${AUDIT_RUN_ID:local}
    writer-id: ${AUDIT_WRITER_ID:${HOSTNAME:demo}}
  consumers:
    processing-enabled: ${DEMO_CONSUMER_PROCESSING_ENABLED:true}
    metrics-implementation: ${METRICS_IMPLEMENTATION:MICROMETER}
    processing-dispatcher-type: ${PROCESSING_DISPATCHER_TYPE:AUTO}
    worker-dispatcher-threads: ${WORKER_DISPATCHER_THREADS:8}
    virtual-thread-name-prefix: ${PROCESSING_DISPATCHER_VIRTUAL_THREAD_NAME_PREFIX:demo-processing-virtual-}
    freshness-first-max-record-age-seconds: ${FRESHNESS_FIRST_MAX_RECORD_AGE_SECONDS:10}
    retry:
      max-attempts: ${DEMO_CONSUMER_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${DEMO_CONSUMER_RETRY_BACKOFF_MS:250}
    order:
      processing-mode: ${ORDER_PROCESSING_MODE:AT_LEAST_ONCE_NO_ORDERING}
      worker-concurrency: ${ORDER_WORKER_CONCURRENCY:2}
      poll-loop-concurrency: ${ORDER_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${ORDER_WORK_CHANNEL_CAPACITY:1024}
    batch:
      processing-mode: ${BATCH_PROCESSING_MODE:AT_LEAST_ONCE_NO_ORDERING}
      worker-concurrency: ${BATCH_WORKER_CONCURRENCY:2}
      poll-loop-concurrency: ${BATCH_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${BATCH_WORK_CHANNEL_CAPACITY:1024}
    telemetry:
      processing-mode: ${TELEMETRY_PROCESSING_MODE:FRESHNESS_FIRST_REPLACE_PENDING_BY_KEY}
      worker-concurrency: ${TELEMETRY_WORKER_CONCURRENCY:4}
      poll-loop-concurrency: ${TELEMETRY_POLL_LOOP_CONCURRENCY:1}
      work-channel-capacity: ${TELEMETRY_WORK_CHANNEL_CAPACITY:256}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        ckc.demo.model.call.duration: true
        ckc.demo.cauldron.telemetry.event.gap: true
        lettuce.command.completion: true
        demo.ckc.record.process.duration: true
        demo.ckc.record.age: true
